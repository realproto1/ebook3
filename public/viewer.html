<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#667eea">
    <title>탱고북 - 동화책 뷰어</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
        }
        .book-card {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .book-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .filter-btn {
            transition: all 0.2s;
        }
        .filter-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }
        
        /* 모바일 최적화 */
        @media (max-width: 768px) {
            .container {
                padding-left: 1rem;
                padding-right: 1rem;
            }
            
            header h1 {
                font-size: 2rem !important;
            }
            
            header p {
                font-size: 1rem !important;
            }
            
            .filter-btn {
                padding: 0.5rem 0.75rem !important;
                font-size: 0.875rem !important;
            }
            
            .book-card {
                margin-bottom: 1rem;
            }
        }
        
        /* 터치 영역 개선 */
        .book-card, .filter-btn, button {
            min-height: 44px;
        }
    </style>
</head>
<body>
    <div class="container mx-auto px-4 py-8">
        <!-- 헤더 -->
        <header class="mb-12">
            <div class="flex items-center justify-between">
                <div class="flex-1">
                    <a href="/home.html" class="text-white hover:text-gray-200 transition mb-2 inline-block">
                        <i class="fas fa-arrow-left mr-2"></i>
                        홈으로
                    </a>
                    <h1 class="text-5xl font-bold text-white mb-2">
                        <i class="fas fa-book-open mr-3"></i>
                        동화책 뷰어
                    </h1>
                    <p class="text-white text-xl opacity-90">공개된 동화책을 읽어보세요!</p>
                </div>
                
                <!-- 관리자 아이콘 (저작 도구) -->
                <a 
                    href="/author.html"
                    class="w-12 h-12 bg-white/90 hover:bg-white backdrop-blur-sm rounded-full flex items-center justify-center shadow-xl transition transform hover:scale-110"
                    title="저작 도구 (관리자)"
                >
                    <i class="fas fa-user-cog text-purple-600 text-xl"></i>
                </a>
            </div>
        </header>

        <!-- 필터 -->
        <div class="mb-8 bg-white rounded-2xl shadow-xl p-6">
            <div class="flex flex-wrap gap-4 items-center">
                <div class="flex-1">
                    <label class="block text-gray-700 font-semibold mb-2">
                        <i class="fas fa-filter mr-2"></i>
                        연령대
                    </label>
                    <div class="flex gap-2">
                        <button onclick="filterByAge('')" class="filter-btn active px-4 py-2 rounded-lg bg-gray-200 text-gray-700 font-semibold" data-age="">
                            전체
                        </button>
                        <button onclick="filterByAge('4-5')" class="filter-btn px-4 py-2 rounded-lg bg-gray-200 text-gray-700 font-semibold" data-age="4-5">
                            4-5세
                        </button>
                        <button onclick="filterByAge('5-7')" class="filter-btn px-4 py-2 rounded-lg bg-gray-200 text-gray-700 font-semibold" data-age="5-7">
                            5-7세
                        </button>
                        <button onclick="filterByAge('7-8')" class="filter-btn px-4 py-2 rounded-lg bg-gray-200 text-gray-700 font-semibold" data-age="7-8">
                            7-8세
                        </button>
                    </div>
                </div>
                
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">
                        <i class="fas fa-sort mr-2"></i>
                        정렬
                    </label>
                    <select id="sort-select" onchange="sortBooks()" class="px-4 py-2 rounded-lg border-2 border-gray-300 focus:border-purple-500 outline-none">
                        <option value="latest">최신순</option>
                        <option value="oldest">오래된순</option>
                        <option value="title">제목순</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- 로딩 상태 -->
        <div id="loading" class="text-center py-20 hidden">
            <div class="inline-block animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-white"></div>
            <p class="text-white text-xl mt-4">동화책을 불러오는 중...</p>
        </div>

        <!-- 빈 상태 -->
        <div id="empty-state" class="text-center py-20 bg-white rounded-2xl shadow-xl hidden">
            <i class="fas fa-book text-6xl text-gray-300 mb-4"></i>
            <h3 class="text-2xl font-bold text-gray-700 mb-2">공개된 동화책이 없습니다</h3>
            <p class="text-gray-500 mb-6">저작 도구에서 동화책을 만들고 공개해보세요!</p>
            <a href="/home.html" class="inline-block bg-purple-500 hover:bg-purple-600 text-white px-6 py-3 rounded-lg font-semibold transition">
                <i class="fas fa-magic mr-2"></i>
                저작 도구로 이동
            </a>
        </div>

        <!-- 동화책 그리드 -->
        <div id="books-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- JavaScript로 동적 생성 -->
        </div>
    </div>

    <!-- 로딩 모달 -->
    <div id="loading-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-8 text-center">
            <div class="animate-spin rounded-full h-20 w-20 border-b-4 border-indigo-600 mx-auto mb-4"></div>
            <h3 class="text-xl font-bold text-gray-800 mb-2">동화책 불러오는 중...</h3>
            <p class="text-gray-600 text-sm">잠시만 기다려주세요</p>
        </div>
    </div>

    <!-- 언어 선택 모달 -->
    <div id="language-select-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 transform transition-all">
            <!-- 모달 헤더 -->
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-2xl font-bold text-gray-800 flex items-center">
                    <i class="fas fa-language text-indigo-600 mr-3"></i>
                    언어 선택
                </h3>
                <button onclick="closeLanguageModal()" class="text-gray-400 hover:text-gray-600 transition-colors">
                    <i class="fas fa-times text-2xl"></i>
                </button>
            </div>

            <!-- 동화책 정보 -->
            <div id="language-modal-book-info" class="mb-6 p-4 bg-gradient-to-r from-indigo-50 to-purple-50 rounded-lg">
                <p class="text-sm text-gray-600 mb-1">선택한 동화책</p>
                <p id="language-modal-book-title" class="text-lg font-bold text-gray-800"></p>
            </div>

            <!-- 언어 버튼 목록 -->
            <div id="language-buttons" class="space-y-3">
                <!-- JavaScript로 동적 생성 -->
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
    <script src="/viewer/js/viewer.js"></script>
</body>
</html>
