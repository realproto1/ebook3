<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#6366f1">
    <title>탱고북 - 동화책 뷰어</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        /* 모던 그라디언트 배경 */
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        
        /* 글래스모피즘 효과 */
        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .glass-light {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        /* 북 카드 호버 효과 */
        .book-card {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        
        .book-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1) 0%, rgba(139, 92, 246, 0.1) 100%);
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: 1;
            pointer-events: none; /* 클릭 이벤트를 통과시킴 */
        }
        
        .book-card:hover {
            transform: translateY(-12px) scale(1.02);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
        }
        
        .book-card:hover::before {
            opacity: 1;
        }
        
        .book-card img {
            transition: transform 0.4s ease;
        }
        
        .book-card:hover img {
            transform: scale(1.05);
        }
        
        /* 필터 버튼 */
        .filter-btn {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        
        .filter-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(99, 102, 241, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        
        .filter-btn:hover::before {
            width: 300px;
            height: 300px;
        }
        
        .filter-btn.active {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
            transform: translateY(-2px);
        }
        
        /* 페이드인 애니메이션 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .fade-in {
            animation: fadeInUp 0.6s ease-out;
        }
        
        /* 로딩 스피너 */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .spinner {
            animation: spin 1s linear infinite;
        }
        
        /* 배지 */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.025em;
        }
        
        .badge-primary {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
        }
        
        .badge-success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }
        
        /* 모바일 최적화 */
        @media (max-width: 768px) {
            .container {
                padding-left: 1rem;
                padding-right: 1rem;
            }
            
            header h1 {
                font-size: 2rem !important;
            }
            
            header p {
                font-size: 1rem !important;
            }
            
            .filter-btn {
                padding: 0.5rem 0.75rem !important;
                font-size: 0.875rem !important;
            }
            
            .book-card {
                margin-bottom: 1rem;
            }
            
            .badge {
                font-size: 0.625rem;
                padding: 0.2rem 0.5rem;
            }
        }
        
        /* 터치 영역 개선 */
        .book-card, .filter-btn, button {
            min-height: 44px;
        }
        
        /* 버튼이 hover 레이어 위에 오도록 */
        .book-card button {
            position: relative;
            z-index: 10;
        }
        
        /* 스크롤바 스타일링 */
        ::-webkit-scrollbar {
            width: 10px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
        }
        
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 5px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }
        
        /* 헤더 애니메이션 */
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        header {
            animation: slideDown 0.8s ease-out;
        }
        
        /* 카드 이미지 */
        .book-cover {
            aspect-ratio: 3/4;
            object-fit: cover;
            background: linear-gradient(135deg, #e0e7ff 0%, #f3e8ff 100%);
        }
    </style>
</head>
<body>
    <div class="container mx-auto px-4 py-8 max-w-7xl">
        <!-- 헤더 -->
        <header class="mb-12">
            <div class="flex items-center justify-between flex-wrap gap-4">
                <div class="flex-1">
                    <a href="/home.html" class="glass-light text-white hover:bg-white/20 px-4 py-2 rounded-full transition mb-4 inline-flex items-center font-medium">
                        <i class="fas fa-arrow-left mr-2"></i>
                        홈으로
                    </a>
                    <h1 class="text-5xl font-bold text-white mb-3 flex items-center gap-3">
                        <div class="w-14 h-14 glass-light rounded-2xl flex items-center justify-center">
                            <i class="fas fa-book-open text-2xl"></i>
                        </div>
                        <span>동화책 뷰어</span>
                    </h1>
                    <p class="text-white/90 text-xl ml-1">공개된 멋진 동화책을 읽어보세요! 📚✨</p>
                </div>
                
                <!-- 관리자 아이콘 -->
                <a 
                    href="/author.html"
                    class="w-14 h-14 glass hover:scale-110 rounded-2xl flex items-center justify-center shadow-2xl transition-all duration-300"
                    title="저작 도구 (관리자)"
                >
                    <i class="fas fa-user-cog text-indigo-600 text-2xl"></i>
                </a>
            </div>
        </header>

        <!-- 필터 -->
        <div class="mb-8 glass rounded-3xl shadow-2xl p-6 fade-in">
            <div class="flex flex-wrap gap-6 items-end">
                <!-- 카테고리 필터 -->
                <div class="flex-1 min-w-[240px]">
                    <label class="block text-gray-700 font-bold mb-3 flex items-center">
                        <i class="fas fa-tag text-indigo-600 mr-2"></i>
                        카테고리
                    </label>
                    <div class="flex flex-wrap gap-2">
                        <button onclick="filterByCategory('')" class="filter-btn active px-5 py-2.5 rounded-xl bg-gray-100 text-gray-700 font-semibold relative z-10" data-category="">
                            <i class="fas fa-globe mr-1"></i>
                            전체
                        </button>
                        <button onclick="filterByCategory('세계 명작')" class="filter-btn px-5 py-2.5 rounded-xl bg-gray-100 text-gray-700 font-semibold relative z-10" data-category="세계 명작">
                            📚 세계 명작
                        </button>
                        <button onclick="filterByCategory('전래 동화')" class="filter-btn px-5 py-2.5 rounded-xl bg-gray-100 text-gray-700 font-semibold relative z-10" data-category="전래 동화">
                            🏮 전래 동화
                        </button>
                        <button onclick="filterByCategory('자연 관찰')" class="filter-btn px-5 py-2.5 rounded-xl bg-gray-100 text-gray-700 font-semibold relative z-10" data-category="자연 관찰">
                            🌿 자연 관찰
                        </button>
                        <button onclick="filterByCategory('기타')" class="filter-btn px-5 py-2.5 rounded-xl bg-gray-100 text-gray-700 font-semibold relative z-10" data-category="기타">
                            📖 기타
                        </button>
                    </div>
                </div>
                
                <!-- 연령대 필터 -->
                <div class="flex-1 min-w-[240px]">
                    <label class="block text-gray-700 font-bold mb-3 flex items-center">
                        <i class="fas fa-filter text-indigo-600 mr-2"></i>
                        연령대
                    </label>
                    <div class="flex flex-wrap gap-2">
                        <button onclick="filterByAge('')" class="filter-btn px-5 py-2.5 rounded-xl bg-gray-100 text-gray-700 font-semibold relative z-10" data-age="">
                            <i class="fas fa-globe mr-1"></i>
                            전체
                        </button>
                        <button onclick="filterByAge('4-5')" class="filter-btn px-5 py-2.5 rounded-xl bg-gray-100 text-gray-700 font-semibold relative z-10" data-age="4-5">
                            <i class="fas fa-baby mr-1"></i>
                            4-5세
                        </button>
                        <button onclick="filterByAge('5-7')" class="filter-btn px-5 py-2.5 rounded-xl bg-gray-100 text-gray-700 font-semibold relative z-10" data-age="5-7">
                            <i class="fas fa-child mr-1"></i>
                            5-7세
                        </button>
                        <button onclick="filterByAge('7-8')" class="filter-btn px-5 py-2.5 rounded-xl bg-gray-100 text-gray-700 font-semibold relative z-10" data-age="7-8">
                            <i class="fas fa-user-graduate mr-1"></i>
                            7-8세
                        </button>
                    </div>
                </div>
                
                <div>
                    <label class="block text-gray-700 font-bold mb-3 flex items-center">
                        <i class="fas fa-sort text-indigo-600 mr-2"></i>
                        정렬
                    </label>
                    <select id="sort-select" onchange="sortBooks()" class="px-5 py-2.5 rounded-xl border-2 border-gray-200 focus:border-indigo-500 outline-none bg-white font-semibold text-gray-700 cursor-pointer transition-all hover:border-indigo-400">
                        <option value="title" selected>📖 제목순</option>
                        <option value="latest">🆕 최신순</option>
                        <option value="oldest">🕰️ 오래된순</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- 로딩 상태 -->
        <div id="loading" class="text-center py-24 hidden">
            <div class="inline-block spinner rounded-full h-20 w-20 border-t-4 border-b-4 border-white"></div>
            <p class="text-white text-2xl font-bold mt-6">✨ 동화책을 불러오는 중...</p>
        </div>

        <!-- 빈 상태 -->
        <div id="empty-state" class="text-center py-24 glass rounded-3xl shadow-2xl hidden">
            <div class="w-32 h-32 mx-auto mb-6 rounded-full glass-light flex items-center justify-center">
                <i class="fas fa-book text-6xl text-indigo-300"></i>
            </div>
            <h3 class="text-3xl font-bold text-gray-800 mb-3">아직 공개된 동화책이 없습니다</h3>
            <p class="text-gray-600 text-lg mb-8">저작 도구에서 멋진 동화책을 만들고 공개해보세요! 🎨</p>
            <a href="/home.html" class="inline-flex items-center bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white px-8 py-4 rounded-2xl font-bold text-lg transition-all shadow-xl hover:shadow-2xl transform hover:scale-105">
                <i class="fas fa-magic mr-3"></i>
                저작 도구로 이동
            </a>
        </div>

        <!-- 동화책 그리드 -->
        <div id="books-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- JavaScript로 동적 생성 -->
        </div>
    </div>

    <!-- 로딩 모달 -->
    <div id="loading-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="glass rounded-3xl shadow-2xl max-w-sm w-full p-10 text-center transform transition-all scale-100">
            <div class="spinner rounded-full h-24 w-24 border-b-4 border-indigo-600 mx-auto mb-6"></div>
            <h3 class="text-2xl font-bold text-gray-800 mb-3">동화책 불러오는 중...</h3>
            <p class="text-gray-600">잠시만 기다려주세요 ✨</p>
        </div>
    </div>

    <!-- 언어 선택 모달 -->
    <div id="language-select-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="glass rounded-3xl shadow-2xl max-w-md w-full p-8 transform transition-all">
            <!-- 모달 헤더 -->
            <div class="flex items-center justify-between mb-8">
                <h3 class="text-3xl font-bold text-gray-800 flex items-center">
                    <div class="w-12 h-12 bg-gradient-to-r from-indigo-600 to-purple-600 rounded-2xl flex items-center justify-center mr-3">
                        <i class="fas fa-language text-white text-xl"></i>
                    </div>
                    언어 선택
                </h3>
                <button onclick="closeLanguageModal()" class="w-10 h-10 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-xl transition-all">
                    <i class="fas fa-times text-2xl"></i>
                </button>
            </div>

            <!-- 동화책 정보 -->
            <div id="language-modal-book-info" class="mb-8 p-5 bg-gradient-to-r from-indigo-50 to-purple-50 rounded-2xl border border-indigo-100">
                <p class="text-sm text-gray-600 mb-1 font-medium">📚 선택한 동화책</p>
                <p id="language-modal-book-title" class="text-xl font-bold text-gray-800"></p>
            </div>

            <!-- 언어 버튼 목록 -->
            <div id="language-buttons" class="space-y-3">
                <!-- JavaScript로 동적 생성 -->
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
    <script src="/viewer/js/viewer.js"></script>
</body>
</html>
