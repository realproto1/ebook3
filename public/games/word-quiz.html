<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>❓ 단어 퀴즈 - 탱고북</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #FFF5F7 0%, #FFE8EE 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .game-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .game-header {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(255, 107, 157, 0.1);
        }

        .game-header h1 {
            font-size: 36px;
            color: #FF6B9D;
            margin-bottom: 10px;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            background: linear-gradient(135deg, #FF6B9D, #FF8DB4);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 15px;
        }

        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 157, 0.3);
        }

        .progress-section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 3px 10px rgba(255, 107, 157, 0.1);
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 18px;
            color: #666;
        }

        .progress-bar {
            height: 12px;
            background: #FFE8EE;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #FF6B9D, #FF8DB4);
            transition: width 0.5s;
        }

        .game-area {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 5px 15px rgba(255, 107, 157, 0.1);
        }

        .question-box {
            text-align: center;
            margin-bottom: 40px;
        }

        .question-image {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 20px;
            margin: 0 auto 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .question-text {
            font-size: 28px;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
        }

        .question-hint {
            font-size: 16px;
            color: #999;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 30px;
        }

        .option-button {
            padding: 20px;
            font-size: 18px;
            font-weight: 600;
            border: 3px solid #FFE8EE;
            border-radius: 15px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        .option-button:hover {
            border-color: #FF6B9D;
            transform: scale(1.05);
        }

        .option-button.correct {
            border-color: #4CAF50;
            background: #E8F5E9;
            animation: pulse 0.5s;
        }

        .option-button.wrong {
            border-color: #F44336;
            background: #FFEBEE;
            animation: shake 0.5s;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .result-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .result-content {
            background: white;
            border-radius: 30px;
            padding: 50px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .result-content h2 {
            font-size: 36px;
            color: #FF6B9D;
            margin: 20px 0;
        }

        .result-stats {
            font-size: 20px;
            margin: 30px 0;
            color: #666;
        }

        .result-stats div {
            margin: 10px 0;
        }

        .result-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #FF6B9D, #FF8DB4);
            color: white;
        }

        .btn-secondary {
            background: #E0E0E0;
            color: #666;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .explanation-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1001;
            align-items: center;
            justify-content: center;
        }

        .explanation-content {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .explanation-content h3 {
            font-size: 32px;
            color: #4CAF50;
            margin-bottom: 20px;
        }

        .explanation-content .word {
            font-size: 36px;
            font-weight: 700;
            color: #FF6B9D;
            margin-bottom: 15px;
        }

        .explanation-content .meaning {
            font-size: 20px;
            color: #666;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .explanation-content .example {
            font-size: 18px;
            color: #999;
            font-style: italic;
            padding: 15px;
            background: #FFF5F7;
            border-left: 4px solid #FF6B9D;
            border-radius: 8px;
        }

        @media (max-width: 768px) {
            .game-header h1 {
                font-size: 28px;
            }

            .options-grid {
                grid-template-columns: 1fr;
            }

            .question-text {
                font-size: 22px;
            }

            .option-button {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- 헤더 -->
        <div class="game-header">
            <button class="back-button" onclick="goBack()">
                <i class="fas fa-arrow-left"></i>
                돌아가기
            </button>
            <h1>❓ 단어 퀴즈</h1>
            <div id="story-title" style="font-size: 18px; color: #999;"></div>
        </div>

        <!-- 진행 상태 -->
        <div class="progress-section">
            <div class="progress-info">
                <span>문제 <strong id="current-question">1</strong> / <strong id="total-questions">8</strong></span>
                <span>정답: <strong id="correct-count" style="color: #4CAF50;">0</strong>개</span>
            </div>
            <div class="progress-bar">
                <div id="progress-fill" class="progress-fill" style="width: 0%;"></div>
            </div>
        </div>

        <!-- 게임 영역 -->
        <div class="game-area">
            <div class="question-box">
                <img id="question-image" class="question-image" style="display: none;">
                <div id="question-text" class="question-text"></div>
                <div id="question-hint" class="question-hint"></div>
            </div>

            <div id="options-grid" class="options-grid">
                <!-- JavaScript로 동적 생성 -->
            </div>
        </div>
    </div>

    <!-- 단어 설명 모달 -->
    <div id="explanation-modal" class="explanation-modal">
        <div class="explanation-content">
            <h3>✅ 정답입니다!</h3>
            <div id="explanation-word" class="word"></div>
            <div id="explanation-meaning" class="meaning"></div>
            <div id="explanation-example" class="example"></div>
            <button class="btn btn-primary" onclick="closeExplanation()" style="margin-top: 30px; width: 100%;">
                다음 문제로 →
            </button>
        </div>
    </div>

    <!-- 결과 모달 -->
    <div id="result-modal" class="result-modal">
        <div class="result-content">
            <div id="result-icon" style="font-size: 80px;">🏆</div>
            <h2>게임 완료!</h2>
            <div class="result-stats">
                <div>정답: <strong id="final-correct" style="color: #4CAF50;">0</strong>개</div>
                <div>오답: <strong id="final-wrong" style="color: #F44336;">0</strong>개</div>
                <div>정확도: <strong id="final-accuracy" style="color: #FF6B9D;">0</strong>%</div>
                <div id="final-grade" style="font-size: 24px; margin-top: 20px; font-weight: 700;"></div>
            </div>
            <div class="result-buttons">
                <button class="btn btn-primary" onclick="restartGame()">
                    <i class="fas fa-redo"></i> 다시 하기
                </button>
                <button class="btn btn-secondary" onclick="goToGames()">
                    <i class="fas fa-list"></i> 게임 목록
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
    <script src="/games/word-quiz.js"></script>
</body>
</html>
