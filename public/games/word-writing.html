<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글자 따라 쓰기 - 탱고북</title>
    <!-- TODO: 프로덕션 배포 시 Tailwind CSS를 PostCSS 플러그인으로 변경 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .game-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .game-header {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .story-title {
            font-size: 24px;
            font-weight: bold;
            color: #fcb69f;
            text-align: center;
            margin-bottom: 10px;
        }

        .progress-bar {
            background: #e0e0e0;
            border-radius: 10px;
            height: 20px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            background: linear-gradient(90deg, #ffecd2 0%, #fcb69f 100%);
            height: 100%;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: bold;
        }

        .game-area {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .char-number {
            font-size: 18px;
            font-weight: bold;
            color: #fcb69f;
            margin-bottom: 15px;
            text-align: center;
        }

        .key-object-image {
            width: 100%;
            max-width: 200px;
            height: 200px;
            object-fit: contain;
            border-radius: 15px;
            margin: 20px auto;
            display: block;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .target-char {
            font-size: 120px;
            font-weight: bold;
            color: #fcb69f;
            text-align: center;
            margin: 30px 0;
            font-family: 'Noto Sans KR', sans-serif;
            line-height: 1;
        }

        .canvas-container {
            position: relative;
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }

        #drawingCanvas {
            border: 3px solid #fcb69f;
            border-radius: 15px;
            cursor: crosshair;
            touch-action: none;
            background: white;
        }

        #guideOverlay {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
            opacity: 0.15;
            font-size: 300px;
            font-weight: bold;
            color: #fcb69f;
            font-family: 'Noto Sans KR', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-warning {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-success {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            color: #333;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #fcb69f;
        }

        .stat-label {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }

        .result-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .result-modal.show {
            display: flex;
        }

        .result-content {
            background: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 400px;
            animation: bounceIn 0.5s ease;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }

        .result-score {
            font-size: 48px;
            font-weight: bold;
            color: #fcb69f;
            margin: 20px 0;
        }

        .result-message {
            font-size: 24px;
            color: #333;
            margin-bottom: 30px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .feedback-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px 50px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            font-size: 48px;
            font-weight: bold;
            z-index: 999;
            animation: fadeInOut 1s ease;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
            20% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
            80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
        }

        .feedback-correct {
            color: #4CAF50;
        }

        .feedback-retry {
            color: #ff9800;
        }

        /* 실시간 정확도 표시 */
        #realTimeAccuracy {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #fcb69f;
            margin: 10px 0;
            min-height: 30px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <button class="btn btn-secondary" onclick="goBack()" style="position: absolute; top: 20px; left: 20px;">
                <i class="fas fa-arrow-left"></i> 돌아가기
            </button>
            <div class="story-title" id="storyTitle">글자 따라 쓰기</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%;">0%</div>
            </div>
        </div>

        <div class="game-area">
            <div class="char-number" id="charNumber">1 / 5</div>
            
            <img id="keyObjectImage" class="key-object-image" style="display: none;">
            
            <div class="target-char" id="targetChar"></div>

            <!-- 실시간 정확도 표시 -->
            <div id="realTimeAccuracy"></div>

            <div class="canvas-container">
                <canvas id="drawingCanvas" width="400" height="400"></canvas>
            </div>

            <div class="control-buttons">
                <button class="btn btn-warning" id="clearBtn">
                    <i class="fas fa-eraser"></i> 지우기
                </button>
                <button class="btn btn-success" id="checkBtn">
                    <i class="fas fa-check"></i> 확인
                </button>
                <button class="btn btn-secondary" id="skipBtn">
                    <i class="fas fa-forward"></i> 건너뛰기
                </button>
            </div>

            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="accuracyValue">0%</div>
                    <div class="stat-label">완성률</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="attemptsValue">0</div>
                    <div class="stat-label">시도 횟수</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 결과 모달 -->
    <div class="result-modal" id="resultModal">
        <div class="result-content">
            <i class="fas fa-trophy" style="font-size: 80px; color: #ffd700;"></i>
            <div class="result-score" id="resultScore">5 / 5</div>
            <div class="result-message" id="resultMessage">완벽해요! 🎉</div>
            <div class="button-group">
                <button class="btn btn-primary" id="restartBtn">
                    <i class="fas fa-redo"></i> 다시 하기
                </button>
                <button class="btn btn-secondary" onclick="goBack()">
                    <i class="fas fa-list"></i> 게임 목록
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
    <script type="module">
        // 모듈 import
        import { API } from '/js/core/api.js';
        import { Storage } from '/js/utils/storage.js';
        import { audioPlayer } from '/js/utils/audio.js';
        import { DOM } from '/js/utils/dom.js';
        import WordWritingGame from '/js/games/WordWritingGame.js';

        // 전역 함수 (HTML onclick 이벤트용)
        window.goBack = function() {
            const storyId = game?.storyId;
            if (storyId) {
                window.location.href = `/games.html?id=${storyId}`;
            } else {
                window.history.back();
            }
        };

        // 게임 인스턴스
        let game = null;

        // 페이지 로드 시 초기화
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // URL에서 storyId 추출
                const urlParams = new URLSearchParams(window.location.search);
                const storyId = urlParams.get('story') || urlParams.get('id');

                if (!storyId) {
                    alert('스토리 ID가 없습니다.');
                    window.history.back();
                    return;
                }

                // 게임 초기화
                game = new WordWritingGame({
                    storyId: storyId,
                    debug: false
                });

                await game.init();

                // 이벤트 리스너 등록
                setupEventListeners();

            } catch (error) {
                console.error('게임 초기화 실패:', error);
                alert('게임을 불러오는데 실패했습니다.');
                window.history.back();
            }
        });

        /**
         * 이벤트 리스너 설정
         */
        function setupEventListeners() {
            // 지우기 버튼
            document.getElementById('clearBtn').addEventListener('click', () => {
                game.clearCanvas();
            });

            // 확인 버튼
            document.getElementById('checkBtn').addEventListener('click', () => {
                game.checkDrawing();
            });

            // 건너뛰기 버튼
            document.getElementById('skipBtn').addEventListener('click', () => {
                game.skipChar();
            });

            // 다시 하기 버튼
            document.getElementById('restartBtn').addEventListener('click', () => {
                game.restartGame();
            });
        }
    </script>
</body>
</html>
