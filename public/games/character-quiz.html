<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👤 캐릭터 맞히기 - 탱고북</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #E8EAF6 0%, #C5CAE9 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .game-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .game-header {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(103, 58, 183, 0.1);
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            background: linear-gradient(135deg, #673AB7, #9575CD);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 15px;
        }

        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(103, 58, 183, 0.3);
        }

        .game-area {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 5px 15px rgba(103, 58, 183, 0.1);
        }

        .quote-box {
            background: linear-gradient(135deg, #F3E5F5 0%, #E1BEE7 100%);
            border-left: 5px solid #9C27B0;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            font-size: 22px;
            font-style: italic;
            color: #4A148C;
            line-height: 1.6;
        }

        .character-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .character-card {
            border: 3px solid #E1BEE7;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: white;
        }

        .character-card:hover {
            transform: translateY(-5px);
            border-color: #9C27B0;
            box-shadow: 0 5px 15px rgba(156, 39, 176, 0.3);
        }

        .character-image {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 50%;
            margin: 0 auto 15px;
            border: 3px solid #E1BEE7;
        }

        .character-name {
            font-size: 20px;
            font-weight: 700;
            color: #4A148C;
        }

        .character-card.correct {
            border-color: #4CAF50;
            background: #E8F5E9;
            animation: pulse 0.5s;
        }

        .character-card.wrong {
            border-color: #F44336;
            background: #FFEBEE;
            animation: shake 0.5s;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .result-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .result-content {
            background: white;
            border-radius: 30px;
            padding: 50px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .btn {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #673AB7, #9575CD);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <button class="back-button" onclick="goBack()">
                <i class="fas fa-arrow-left"></i>
                돌아가기
            </button>
            <h1 style="font-size: 36px; color: #673AB7; margin-bottom: 10px;">👤 캐릭터 맞히기</h1>
            <div id="story-title" style="font-size: 18px; color: #999;"></div>
        </div>

        <div class="game-area">
            <div style="text-align: center; margin-bottom: 30px;">
                <div style="font-size: 20px; color: #666; margin-bottom: 10px;">
                    문제 <strong id="current-question">1</strong> / <strong id="total-questions">5</strong>
                </div>
                <div style="font-size: 18px; color: #4CAF50;">
                    정답: <strong id="correct-count">0</strong>개
                </div>
            </div>

            <div class="quote-box" id="quote-text">
                "이 대사를 누가 말했을까요?"
            </div>

            <div style="text-align: center; font-size: 20px; color: #673AB7; margin-bottom: 20px; font-weight: 600;">
                누가 이 말을 했을까요?
            </div>

            <div id="character-grid" class="character-grid">
                <!-- JavaScript로 동적 생성 -->
            </div>
        </div>
    </div>

    <!-- 결과 모달 -->
    <div id="result-modal" class="result-modal">
        <div class="result-content">
            <div style="font-size: 80px;">🏆</div>
            <h2 style="font-size: 36px; color: #673AB7; margin: 20px 0;">게임 완료!</h2>
            <div style="font-size: 20px; margin: 30px 0; color: #666;">
                <div style="margin: 10px 0;">정답: <strong id="final-correct" style="color: #4CAF50;">0</strong>개</div>
                <div style="margin: 10px 0;">오답: <strong id="final-wrong" style="color: #F44336;">0</strong>개</div>
                <div style="margin: 10px 0;">정확도: <strong id="final-accuracy" style="color: #673AB7;">0</strong>%</div>
            </div>
            <div style="display: flex; gap: 15px; justify-content: center;">
                <button class="btn btn-primary" onclick="location.reload()">
                    <i class="fas fa-redo"></i> 다시 하기
                </button>
                <button class="btn btn-primary" onclick="goBack()">
                    <i class="fas fa-list"></i> 게임 목록
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const storyId = urlParams.get('story') || urlParams.get('id');
        
        let storyData = null;
        let currentQuestionIndex = 0;
        let correctCount = 0;
        let totalQuestions = 5;
        let questions = [];

        async function init() {
            if (!storyId) {
                alert('❌ 스토리 ID가 없습니다.');
                goBack();
                return;
            }

            try {
                const response = await axios.get(`/api/storybooks/${storyId}`);
                storyData = response.data;
                
                document.getElementById('story-title').textContent = storyData.title || '동화책';
                
                // 캐릭터 확인
                if (!storyData.characters || storyData.characters.length < 2) {
                    alert('❌ 이 동화책에는 충분한 캐릭터가 없습니다.\n최소 2명 이상의 캐릭터가 필요합니다.');
                    goBack();
                    return;
                }

                // 퀴즈 생성
                generateQuestions();
                loadQuestion();
                
            } catch (error) {
                console.error('스토리 로드 실패:', error);
                alert('동화책을 불러오는데 실패했습니다.');
                goBack();
            }
        }

        function generateQuestions() {
            const characters = storyData.characters;
            const pages = storyData.pages;
            
            // 각 페이지에서 무작위로 문장 선택
            for (let i = 0; i < Math.min(totalQuestions, pages.length); i++) {
                const page = pages[i];
                const sentences = page.text.split(/[.!?]/).filter(s => s.trim().length > 10);
                
                if (sentences.length > 0) {
                    const randomSentence = sentences[Math.floor(Math.random() * sentences.length)].trim();
                    const correctCharacter = characters[Math.floor(Math.random() * characters.length)];
                    
                    questions.push({
                        quote: randomSentence,
                        correctCharacter: correctCharacter,
                        allCharacters: characters
                    });
                }
            }
            
            totalQuestions = questions.length;
            document.getElementById('total-questions').textContent = totalQuestions;
        }

        function loadQuestion() {
            if (currentQuestionIndex >= questions.length) {
                showResult();
                return;
            }

            const question = questions[currentQuestionIndex];
            
            // 문제 번호 업데이트
            document.getElementById('current-question').textContent = currentQuestionIndex + 1;
            
            // 대사 표시
            document.getElementById('quote-text').textContent = `"${question.quote}"`;
            
            // 캐릭터 카드 생성
            const grid = document.getElementById('character-grid');
            grid.innerHTML = '';
            
            question.allCharacters.forEach(character => {
                const card = document.createElement('div');
                card.className = 'character-card';
                card.onclick = () => checkAnswer(character, card);
                
                if (character.referenceImage) {
                    card.innerHTML = `
                        <img src="${character.referenceImage}" class="character-image" alt="${character.name}">
                        <div class="character-name">${character.name}</div>
                    `;
                } else {
                    card.innerHTML = `
                        <div style="width: 100px; height: 100px; background: linear-gradient(135deg, #E1BEE7, #CE93D8); border-radius: 50%; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 40px;">
                            👤
                        </div>
                        <div class="character-name">${character.name}</div>
                    `;
                }
                
                grid.appendChild(card);
            });
        }

        function checkAnswer(selectedCharacter, cardElement) {
            const question = questions[currentQuestionIndex];
            const allCards = document.querySelectorAll('.character-card');
            
            // 모든 카드 클릭 비활성화
            allCards.forEach(card => card.style.pointerEvents = 'none');
            
            if (selectedCharacter.name === question.correctCharacter.name) {
                cardElement.classList.add('correct');
                correctCount++;
                document.getElementById('correct-count').textContent = correctCount;
            } else {
                cardElement.classList.add('wrong');
            }
            
            setTimeout(() => {
                currentQuestionIndex++;
                loadQuestion();
            }, 1500);
        }

        function showResult() {
            const wrongCount = totalQuestions - correctCount;
            const accuracy = Math.round((correctCount / totalQuestions) * 100);
            
            document.getElementById('final-correct').textContent = correctCount;
            document.getElementById('final-wrong').textContent = wrongCount;
            document.getElementById('final-accuracy').textContent = accuracy;
            
            document.getElementById('result-modal').style.display = 'flex';
        }

        function goBack() {
            window.location.href = `/games.html?id=${storyId}`;
        }

        init();
    </script>
</body>
</html>
