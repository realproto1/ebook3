<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사물 카드 매칭 - 탱고북</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .game-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .game-header {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .story-title {
            font-size: 24px;
            font-weight: bold;
            color: #f5576c;
            text-align: center;
            margin-bottom: 10px;
        }

        .game-stats {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
            gap: 10px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            font-weight: 600;
            color: #666;
        }

        .cards-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .memory-card {
            aspect-ratio: 3/4;
            position: relative;
            cursor: pointer;
            perspective: 1000px;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .memory-card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .memory-card.matched .card-inner {
            transform: rotateY(180deg);
        }

        .memory-card.matched {
            pointer-events: none;
            opacity: 0.7;
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            flex-direction: column;
        }

        .card-back {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .card-front {
            background: white;
            transform: rotateY(180deg);
            padding: 10px;
        }

        .card-image {
            width: 100%;
            height: 70%;
            object-fit: contain;
            border-radius: 10px;
        }

        .card-label {
            font-size: 14px;
            font-weight: bold;
            color: #333;
            margin-top: 8px;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            font-size: 16px;
        }

        .btn-restart {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-restart:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-back {
            background: white;
            color: #666;
        }

        .btn-back:hover {
            background: #f0f0f0;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- 헤더 -->
        <div class="game-header">
            <div class="story-title" id="storyTitle">카드 매칭 게임</div>
            
            <!-- 통계 -->
            <div class="game-stats">
                <div class="stat-item">
                    <i class="fas fa-clock text-purple-500"></i>
                    <span>시간: <span id="timerValue">0:00</span></span>
                </div>
                <div class="stat-item">
                    <i class="fas fa-mouse-pointer text-pink-500"></i>
                    <span>이동: <span id="movesValue">0</span>회</span>
                </div>
                <div class="stat-item">
                    <i class="fas fa-check-circle text-green-500"></i>
                    <span>완성: <span id="pairsValue">0 / 6</span></span>
                </div>
            </div>
        </div>

        <!-- 카드 컨테이너 -->
        <div id="cardsContainer" class="cards-container"></div>

        <!-- 컨트롤 버튼 -->
        <div class="controls">
            <button class="btn btn-restart" onclick="game.restart()">
                <i class="fas fa-redo mr-2"></i>
                다시 시작
            </button>
            <button class="btn btn-back" onclick="game.goBack()">
                <i class="fas fa-arrow-left mr-2"></i>
                돌아가기
            </button>
        </div>
    </div>

    <!-- 모듈 스크립트 -->
    <script type="module">
        import MemoryMatchGame from '/js/games/MemoryMatchGame.js';

        // 게임 인스턴스 생성
        const game = new MemoryMatchGame({
            containerId: 'cardsContainer',
            debug: false,
            pairsCount: 6,
            gridColumns: 4
        });

        // 전역으로 노출 (버튼 onclick에서 사용)
        window.game = game;

        // 게임 초기화
        game.init().catch(error => {
            console.error('❌ 게임 초기화 실패:', error);
        });

        console.log('✅ 모듈 로드 완료 - MemoryMatchGame');
    </script>
</body>
</html>
