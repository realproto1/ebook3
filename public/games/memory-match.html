<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🃏 단어 카드 매칭 - 탱고북</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #FFF5F7 0%, #FFE8EE 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .game-container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .game-header {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(255, 107, 157, 0.1);
        }

        .game-header h1 {
            font-size: 36px;
            color: #FF6B9D;
            margin-bottom: 10px;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            background: linear-gradient(135deg, #FF6B9D, #FF8DB4);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 15px;
        }

        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 157, 0.3);
        }

        .difficulty-selector {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(255, 107, 157, 0.1);
        }

        .difficulty-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 15px;
        }

        .difficulty-btn {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: 600;
            border: 3px solid #FFE8EE;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        .difficulty-btn:hover {
            border-color: #FF6B9D;
            transform: scale(1.05);
        }

        .difficulty-btn.active {
            border-color: #FF6B9D;
            background: #FFF5F7;
            font-weight: 700;
        }

        .game-stats {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 3px 10px rgba(255, 107, 157, 0.1);
            display: flex;
            justify-content: space-around;
            font-size: 18px;
            color: #666;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #FF6B9D;
        }

        .cards-grid {
            display: grid;
            gap: 15px;
            margin-top: 20px;
        }

        .cards-grid.easy {
            grid-template-columns: repeat(4, 1fr);
        }

        .cards-grid.medium {
            grid-template-columns: repeat(4, 1fr);
        }

        .cards-grid.hard {
            grid-template-columns: repeat(4, 1fr);
        }

        .card {
            aspect-ratio: 1;
            background: white;
            border: 4px solid #FFE8EE;
            border-radius: 15px;
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            box-shadow: 0 5px 15px rgba(255, 107, 157, 0.1);
        }

        .card:hover:not(.flipped):not(.matched) {
            border-color: #FF6B9D;
            transform: scale(1.05);
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card.matched {
            border-color: #4CAF50;
            background: #E8F5E9;
            cursor: default;
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            padding: 10px;
        }

        .card-front {
            background: linear-gradient(135deg, #FF6B9D, #FF8DB4);
            color: white;
            font-size: 48px;
        }

        .card-back {
            transform: rotateY(180deg);
            background: white;
        }

        .card-back img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .card-back .text {
            font-size: 24px;
            font-weight: 700;
            color: #333;
            text-align: center;
        }

        .result-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .result-content {
            background: white;
            border-radius: 30px;
            padding: 50px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .result-content h2 {
            font-size: 36px;
            color: #FF6B9D;
            margin: 20px 0;
        }

        .result-stats {
            font-size: 20px;
            margin: 30px 0;
            color: #666;
        }

        .result-stats div {
            margin: 10px 0;
        }

        .result-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #FF6B9D, #FF8DB4);
            color: white;
        }

        .btn-secondary {
            background: #E0E0E0;
            color: #666;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        @media (max-width: 768px) {
            .game-header h1 {
                font-size: 28px;
            }

            .cards-grid {
                gap: 10px;
            }

            .card-front {
                font-size: 36px;
            }

            .card-back .text {
                font-size: 18px;
            }

            .difficulty-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- 헤더 -->
        <div class="game-header">
            <button class="back-button" onclick="goBack()">
                <i class="fas fa-arrow-left"></i>
                돌아가기
            </button>
            <h1>🃏 단어 카드 매칭</h1>
            <div id="story-title" style="font-size: 18px; color: #999;"></div>
        </div>

        <!-- 난이도 선택 -->
        <div class="difficulty-selector">
            <div style="font-size: 20px; font-weight: 700; color: #333; margin-bottom: 10px;">
                난이도를 선택하세요
            </div>
            <div class="difficulty-buttons">
                <button class="difficulty-btn active" onclick="setDifficulty('easy')">
                    😊 쉬움 (4쌍)
                </button>
                <button class="difficulty-btn" onclick="setDifficulty('medium')">
                    😎 보통 (6쌍)
                </button>
                <button class="difficulty-btn" onclick="setDifficulty('hard')">
                    🔥 어려움 (8쌍)
                </button>
            </div>
        </div>

        <!-- 게임 통계 -->
        <div class="game-stats">
            <div class="stat">
                <div class="stat-label">시간</div>
                <div class="stat-value" id="time">0:00</div>
            </div>
            <div class="stat">
                <div class="stat-label">매칭</div>
                <div class="stat-value" id="matches">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">시도</div>
                <div class="stat-value" id="attempts">0</div>
            </div>
        </div>

        <!-- 카드 그리드 -->
        <div id="cards-grid" class="cards-grid easy">
            <!-- JavaScript로 동적 생성 -->
        </div>
    </div>

    <!-- 결과 모달 -->
    <div id="result-modal" class="result-modal">
        <div class="result-content">
            <div id="result-icon" style="font-size: 80px;">🏆</div>
            <h2>게임 완료!</h2>
            <div class="result-stats">
                <div>걸린 시간: <strong id="final-time" style="color: #FF6B9D;">0:00</strong></div>
                <div>총 시도: <strong id="final-attempts" style="color: #2196F3;">0</strong>번</div>
                <div id="final-grade" style="font-size: 24px; margin-top: 20px; font-weight: 700;"></div>
            </div>
            <div class="result-buttons">
                <button class="btn btn-primary" onclick="restartGame()">
                    <i class="fas fa-redo"></i> 다시 하기
                </button>
                <button class="btn btn-secondary" onclick="goToGames()">
                    <i class="fas fa-list"></i> 게임 목록
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
    <script src="/games/memory-match.js"></script>
</body>
</html>
