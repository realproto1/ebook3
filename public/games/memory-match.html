<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🃏 사물 카드 매칭 - 탱고북</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #E8F5E9 0%, #C8E6C9 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .game-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .game-header {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.1);
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            background: linear-gradient(135deg, #4CAF50, #66BB6A);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 15px;
        }

        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
        }

        .game-stats {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            box-shadow: 0 3px 10px rgba(76, 175, 80, 0.1);
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            font-size: 14px;
            color: #999;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #4CAF50;
        }

        .game-area {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.1);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 30px;
        }

        .memory-card {
            aspect-ratio: 1;
            background: linear-gradient(135deg, #A5D6A7 0%, #81C784 100%);
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            transform-style: preserve-3d;
        }

        .memory-card:hover {
            transform: scale(1.05);
        }

        .memory-card.flipped {
            background: white;
            border: 3px solid #4CAF50;
        }

        .memory-card.matched {
            background: #E8F5E9;
            border: 3px solid #4CAF50;
            opacity: 0.6;
            pointer-events: none;
        }

        .card-front,
        .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            backface-visibility: hidden;
        }

        .card-front {
            background: linear-gradient(135deg, #A5D6A7 0%, #81C784 100%);
        }

        .card-back {
            background: white;
        }

        .card-icon {
            font-size: 40px;
            color: white;
        }

        .card-image {
            width: 80%;
            height: 60%;
            object-fit: cover;
            border-radius: 10px;
        }

        .card-name {
            font-size: 12px;
            font-weight: 600;
            color: #333;
            margin-top: 5px;
            text-align: center;
        }

        .result-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .result-content {
            background: white;
            border-radius: 30px;
            padding: 50px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .btn {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4CAF50, #66BB6A);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        @media (max-width: 768px) {
            .cards-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
            }

            .game-header h1 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <button class="back-button" onclick="goBack()">
                <i class="fas fa-arrow-left"></i>
                돌아가기
            </button>
            <h1 style="font-size: 36px; color: #4CAF50; margin-bottom: 10px;">🃏 사물 카드 매칭</h1>
            <div id="story-title" style="font-size: 18px; color: #999;"></div>
        </div>

        <div class="game-stats">
            <div class="stat-item">
                <div class="stat-label">시도 횟수</div>
                <div class="stat-value" id="moves-count">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">맞춘 짝</div>
                <div class="stat-value" id="matches-count">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">남은 짝</div>
                <div class="stat-value" id="remaining-count">0</div>
            </div>
        </div>

        <div class="game-area">
            <div style="text-align: center; font-size: 18px; color: #666; margin-bottom: 20px;">
                <i class="fas fa-lightbulb" style="color: #FFC107; margin-right: 5px;"></i>
                같은 사물 카드 2개를 찾아서 짝을 맞춰보세요!
            </div>

            <div id="cards-grid" class="cards-grid">
                <!-- JavaScript로 동적 생성 -->
            </div>
        </div>
    </div>

    <!-- 결과 모달 -->
    <div id="result-modal" class="result-modal">
        <div class="result-content">
            <div style="font-size: 80px;">🎉</div>
            <h2 style="font-size: 36px; color: #4CAF50; margin: 20px 0;">완성!</h2>
            <div style="font-size: 20px; margin: 30px 0; color: #666;">
                <div style="margin: 10px 0;">총 시도: <strong id="final-moves" style="color: #4CAF50;">0</strong>회</div>
                <div style="margin: 10px 0;">맞춘 짝: <strong id="final-matches" style="color: #4CAF50;">0</strong>개</div>
            </div>
            <div style="display: flex; gap: 15px; justify-content: center;">
                <button class="btn btn-primary" onclick="location.reload()">
                    <i class="fas fa-redo"></i> 다시 하기
                </button>
                <button class="btn btn-primary" onclick="goBack()">
                    <i class="fas fa-list"></i> 게임 목록
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const storyId = urlParams.get('story') || urlParams.get('id');
        
        let storyData = null;
        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let canFlip = true;

        async function init() {
            if (!storyId) {
                alert('❌ 스토리 ID가 없습니다.');
                goBack();
                return;
            }

            try {
                const response = await axios.get(`/api/storybooks/${storyId}`);
                storyData = response.data;
                
                document.getElementById('story-title').textContent = storyData.title || '동화책';
                
                // Key Objects Images 확인
                const keyObjectImages = storyData.keyObjectImages || [];
                const validObjects = keyObjectImages.filter(obj => obj.imageUrl && obj.success);
                
                if (validObjects.length < 4) {
                    alert('❌ 이 동화책에는 충분한 Key Objects 이미지가 없습니다.\n최소 4개 이상이 필요합니다.');
                    goBack();
                    return;
                }

                // 카드 생성 (6쌍 = 12장)
                generateCards();
                renderCards();
                
            } catch (error) {
                console.error('스토리 로드 실패:', error);
                alert('동화책을 불러오는데 실패했습니다.');
                goBack();
            }
        }

        function generateCards() {
            // keyObjectImages 배열 사용 (이미지가 있는 것만)
            const keyObjectImages = storyData.keyObjectImages || [];
            const validObjects = keyObjectImages.filter(obj => obj.imageUrl && obj.success).slice(0, 6);
            
            if (validObjects.length === 0) {
                alert('❌ 이 동화책에는 Key Objects 이미지가 없습니다.');
                goBack();
                return;
            }
            
            // 각 객체를 2번씩 추가 (짝 만들기)
            validObjects.forEach((obj, index) => {
                cards.push({ id: index, object: obj, matched: false });
                cards.push({ id: index, object: obj, matched: false });
            });
            
            // 카드 섞기
            shuffleArray(cards);
            
            // 통계 초기화
            document.getElementById('remaining-count').textContent = validObjects.length;
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function renderCards() {
            const grid = document.getElementById('cards-grid');
            grid.innerHTML = '';
            
            cards.forEach((card, index) => {
                const cardElement = document.createElement('div');
                cardElement.className = 'memory-card';
                cardElement.dataset.index = index;
                cardElement.onclick = () => flipCard(index);
                
                const frontHTML = `
                    <div class="card-front">
                        <i class="fas fa-question card-icon"></i>
                    </div>
                `;
                
                const backHTML = card.object.imageUrl 
                    ? `
                        <div class="card-back">
                            <img src="${card.object.imageUrl}" class="card-image" alt="${card.object.name}">
                            <div class="card-name">${card.object.name}</div>
                        </div>
                    `
                    : `
                        <div class="card-back">
                            <div style="font-size: 40px; margin-bottom: 10px;">🎯</div>
                            <div class="card-name">${card.object.name}</div>
                        </div>
                    `;
                
                cardElement.innerHTML = frontHTML + backHTML;
                grid.appendChild(cardElement);
            });
        }

        function flipCard(index) {
            if (!canFlip || flippedCards.length >= 2) return;
            
            const card = cards[index];
            const cardElement = document.querySelector(`[data-index="${index}"]`);
            
            // 이미 뒤집힌 카드는 무시
            if (cardElement.classList.contains('flipped') || cardElement.classList.contains('matched')) {
                return;
            }
            
            // 카드 뒤집기
            cardElement.classList.add('flipped');
            flippedCards.push({ index, card, element: cardElement });
            
            // 2장 뒤집었을 때
            if (flippedCards.length === 2) {
                moves++;
                document.getElementById('moves-count').textContent = moves;
                canFlip = false;
                
                setTimeout(checkMatch, 800);
            }
        }

        function checkMatch() {
            const [first, second] = flippedCards;
            
            if (first.card.id === second.card.id) {
                // 짝 맞음!
                first.element.classList.add('matched');
                second.element.classList.add('matched');
                
                matchedPairs++;
                document.getElementById('matches-count').textContent = matchedPairs;
                document.getElementById('remaining-count').textContent = 6 - matchedPairs;
                
                // 게임 완료 체크
                if (matchedPairs === 6) {
                    setTimeout(showResult, 500);
                }
            } else {
                // 짝 안 맞음
                first.element.classList.remove('flipped');
                second.element.classList.remove('flipped');
            }
            
            flippedCards = [];
            canFlip = true;
        }

        function showResult() {
            document.getElementById('final-moves').textContent = moves;
            document.getElementById('final-matches').textContent = matchedPairs;
            document.getElementById('result-modal').style.display = 'flex';
        }

        function goBack() {
            window.location.href = `/games.html?id=${storyId}`;
        }

        init();
    </script>
</body>
</html>
