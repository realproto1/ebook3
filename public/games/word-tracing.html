<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✏️ 단어 따라쓰기 - 탱고북</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #FFF5F7 0%, #FFE8EE 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .game-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .game-header {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(255, 107, 157, 0.1);
        }

        .game-header h1 {
            font-size: 36px;
            color: #FF6B9D;
            margin-bottom: 10px;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            background: linear-gradient(135deg, #FF6B9D, #FF8DB4);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 15px;
        }

        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 157, 0.3);
        }

        .progress-section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 3px 10px rgba(255, 107, 157, 0.1);
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 18px;
            color: #666;
        }

        .progress-bar {
            height: 12px;
            background: #FFE8EE;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #FF6B9D, #FF8DB4);
            transition: width 0.5s;
        }

        .game-area {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 5px 15px rgba(255, 107, 157, 0.1);
        }

        .word-display {
            text-align: center;
            margin-bottom: 30px;
        }

        .target-word {
            font-size: 48px;
            font-weight: 700;
            color: #FF6B9D;
            margin-bottom: 10px;
        }

        .word-hint {
            font-size: 18px;
            color: #999;
        }

        .canvas-container {
            position: relative;
            background: #FFF5F7;
            border: 3px dashed #FFE8EE;
            border-radius: 15px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        canvas {
            display: block;
            cursor: crosshair;
            touch-action: none;
        }

        .accuracy-bar {
            background: #FFE8EE;
            border-radius: 10px;
            height: 30px;
            overflow: hidden;
            margin-bottom: 20px;
            position: relative;
        }

        .accuracy-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 16px;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #FFF5F7;
            padding: 10px 20px;
            border-radius: 12px;
        }

        .control-label {
            font-size: 16px;
            color: #666;
            font-weight: 600;
        }

        .slider {
            width: 150px;
        }

        .btn {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #FF6B9D, #FF8DB4);
            color: white;
        }

        .btn-secondary {
            background: #FFA500;
            color: white;
        }

        .btn-danger {
            background: #E0E0E0;
            color: #666;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .feedback {
            text-align: center;
            font-size: 20px;
            font-weight: 700;
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            display: none;
        }

        .feedback.correct {
            background: #E8F5E9;
            color: #4CAF50;
            display: block;
            animation: fadeIn 0.5s;
        }

        .feedback.wrong {
            background: #FFEBEE;
            color: #F44336;
            display: block;
            animation: shake 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .result-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .result-content {
            background: white;
            border-radius: 30px;
            padding: 50px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        @media (max-width: 768px) {
            .game-header h1 {
                font-size: 28px;
            }

            .target-word {
                font-size: 36px;
            }

            .controls {
                flex-direction: column;
            }

            .control-group {
                width: 100%;
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- 헤더 -->
        <div class="game-header">
            <button class="back-button" onclick="goBack()">
                <i class="fas fa-arrow-left"></i>
                돌아가기
            </button>
            <h1>✏️ 단어 따라쓰기</h1>
            <div id="story-title" style="font-size: 18px; color: #999;"></div>
        </div>

        <!-- 진행 상태 -->
        <div class="progress-section">
            <div class="progress-info">
                <span>단어 <strong id="current-word">1</strong> / <strong id="total-words">8</strong></span>
                <span>완료: <strong id="completed-count" style="color: #4CAF50;">0</strong>개</span>
            </div>
            <div class="progress-bar">
                <div id="progress-fill" class="progress-fill" style="width: 0%;"></div>
            </div>
        </div>

        <!-- 게임 영역 -->
        <div class="game-area">
            <div class="word-display">
                <div id="target-word" class="target-word"></div>
                <div id="word-hint" class="word-hint"></div>
            </div>

            <!-- 정확도 바 -->
            <div class="accuracy-bar">
                <div id="accuracy-fill" class="accuracy-fill" style="width: 0%;">
                    정확도: <span id="accuracy-text">0</span>%
                </div>
            </div>

            <!-- Canvas -->
            <div class="canvas-container">
                <canvas id="bg-canvas" style="position: absolute; top: 0; left: 0;"></canvas>
                <canvas id="draw-canvas" style="position: relative;"></canvas>
            </div>

            <!-- 컨트롤 -->
            <div class="controls">
                <div class="control-group">
                    <span class="control-label">✏️ 펜 두께:</span>
                    <input type="range" id="thickness-slider" class="slider" min="5" max="40" value="15">
                    <span id="thickness-value" style="font-weight: 700; color: #FF6B9D;">15px</span>
                </div>
            </div>

            <div class="controls">
                <button id="clear-btn" class="btn btn-danger" onclick="clearCanvas()">
                    <i class="fas fa-eraser"></i> 지우기
                </button>
                <button id="hint-btn" class="btn btn-secondary" onclick="showHint()">
                    <i class="fas fa-lightbulb"></i> 힌트
                </button>
                <button id="check-btn" class="btn btn-primary" onclick="checkAnswer()">
                    <i class="fas fa-check"></i> 확인
                </button>
            </div>

            <!-- 피드백 -->
            <div id="feedback" class="feedback"></div>
        </div>
    </div>

    <!-- 결과 모달 -->
    <div id="result-modal" class="result-modal">
        <div class="result-content">
            <div id="result-icon" style="font-size: 80px;">🏆</div>
            <h2 style="font-size: 36px; color: #FF6B9D; margin: 20px 0;">게임 완료!</h2>
            <div style="font-size: 20px; margin: 30px 0; color: #666;">
                <div style="margin: 10px 0;">완료: <strong id="final-completed" style="color: #4CAF50;">0</strong>개</div>
                <div style="margin: 10px 0;">평균 정확도: <strong id="final-accuracy" style="color: #FF6B9D;">0</strong>%</div>
                <div id="final-grade" style="font-size: 24px; margin-top: 20px; font-weight: 700;"></div>
            </div>
            <div style="display: flex; gap: 15px; justify-content: center;">
                <button class="btn btn-primary" onclick="restartGame()">
                    <i class="fas fa-redo"></i> 다시 하기
                </button>
                <button class="btn btn-danger" onclick="goToGames()">
                    <i class="fas fa-list"></i> 게임 목록
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
    <script src="/games/word-tracing.js"></script>
</body>
</html>
