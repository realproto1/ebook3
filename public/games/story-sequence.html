<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스토리 순서 맞추기 - 탱고북</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .game-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .game-header {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .story-title {
            font-size: 24px;
            font-weight: bold;
            color: #4facfe;
            text-align: center;
            margin-bottom: 10px;
        }

        .question-info {
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            color: #666;
        }

        .game-area {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .question-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .question-text {
            font-size: 18px;
            color: #666;
            margin-top: 10px;
        }

        .pages-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 20px 0;
        }

        .sequence-card {
            background: #f5f5f5;
            border: 3px solid #e0e0e0;
            border-radius: 15px;
            padding: 15px;
            cursor: move;
            transition: all 0.3s ease;
            user-select: none;
            position: relative;
        }

        .sequence-card:hover {
            border-color: #4facfe;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.3);
        }

        .sequence-card.dragging {
            opacity: 0.5;
            transform: scale(0.95);
        }

        .sequence-number {
            display: inline-flex;
            background: #4facfe;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .page-image {
            width: 100%;
            height: 150px;
            object-fit: contain;
            border-radius: 10px;
            margin: 10px 0;
            background: white;
        }

        .page-text {
            font-size: 14px;
            color: #333;
            line-height: 1.4;
            max-height: 60px;
            overflow: hidden;
        }

        .drag-handle {
            position: absolute;
            top: 10px;
            right: 10px;
            color: #999;
            font-size: 20px;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            font-size: 16px;
        }

        .btn-check {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .btn-check:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4);
        }

        .btn-restart {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-back {
            background: white;
            color: #666;
            border: 2px solid #e0e0e0;
        }

        #feedback {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            display: none;
        }

        .feedback {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            animation: fadeIn 0.3s ease;
        }

        .feedback.correct {
            border: 4px solid #10b981;
            color: #065f46;
        }

        .feedback.wrong {
            border: 4px solid #ef4444;
            color: #991b1b;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- 헤더 -->
        <div class="game-header">
            <div class="story-title" id="storyTitle">스토리 순서 맞추기</div>
            <div class="question-info">
                문제 <span id="questionNumber">1</span> / <span id="totalQuestions">4</span>
            </div>
        </div>

        <!-- 게임 영역 -->
        <div class="game-area">
            <div class="question-header">
                <div class="question-text">페이지를 드래그하여 올바른 순서로 배열하세요</div>
            </div>
            
            <div id="pagesContainer" class="pages-container">
                <!-- 페이지 카드가 동적으로 생성됩니다 -->
            </div>

            <div class="controls">
                <button class="btn btn-check" onclick="game.checkAnswer()">
                    <i class="fas fa-check mr-2"></i>
                    정답 확인
                </button>
                <button class="btn btn-back" onclick="game.goBack()">
                    <i class="fas fa-arrow-left mr-2"></i>
                    돌아가기
                </button>
            </div>
        </div>
    </div>

    <!-- 피드백 -->
    <div id="feedback"></div>

    <!-- 모듈 스크립트 -->
    <script type="module">
        import StorySequenceGame from '/js/games/StorySequenceGame.js';

        // 게임 인스턴스 생성
        const game = new StorySequenceGame({
            containerId: 'pagesContainer',
            debug: false,
            totalQuestions: 4,
            pagesPerQuestion: 4
        });

        // 전역으로 노출 (버튼 onclick에서 사용)
        window.game = game;

        // 게임 초기화
        game.init().catch(error => {
            console.error('❌ 게임 초기화 실패:', error);
        });

        console.log('✅ 모듈 로드 완료 - StorySequenceGame');
    </script>
</body>
</html>
