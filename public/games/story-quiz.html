<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>핵심 사물 퀴즈 - 탱고북</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .game-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .game-header {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .story-title {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
            text-align: center;
            margin-bottom: 10px;
        }

        .progress-bar {
            background: #e0e0e0;
            border-radius: 10px;
            height: 20px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            height: 100%;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: bold;
            width: 0%;
        }

        .game-area {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .question-number {
            font-size: 18px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 15px;
            text-align: center;
        }

        .key-object-image {
            width: 100%;
            max-width: 300px;
            height: 300px;
            object-fit: contain;
            border-radius: 15px;
            margin: 20px auto;
            display: block;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .question-text {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin: 20px 0;
            text-align: center;
        }

        .options-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-top: 30px;
        }

        .option-btn {
            background: white;
            border: 3px solid #e0e0e0;
            border-radius: 15px;
            padding: 20px;
            font-size: 18px;
            font-weight: 600;
            color: #333;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .option-btn:hover:not(:disabled) {
            border-color: #667eea;
            background: #f5f5ff;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }

        .option-btn.correct {
            border-color: #10b981;
            background: #d1fae5;
            color: #065f46;
        }

        .option-btn.wrong {
            border-color: #ef4444;
            background: #fee2e2;
            color: #991b1b;
        }

        .option-btn:disabled {
            cursor: not-allowed;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            font-size: 16px;
        }

        .btn-restart {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-restart:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-back {
            background: white;
            color: #666;
            border: 2px solid #e0e0e0;
        }

        .btn-back:hover {
            background: #f0f0f0;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- 헤더 -->
        <div class="game-header">
            <div class="story-title" id="storyTitle">핵심 사물 퀴즈</div>
            
            <!-- 진행 상황 -->
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill">0 / 5</div>
            </div>
        </div>

        <!-- 퀴즈 영역 -->
        <div class="game-area">
            <div class="question-number" id="questionNumber">문제 1 / 5</div>
            
            <img id="keyObjectImage" class="key-object-image" src="" alt="퀴즈 이미지">
            
            <div class="question-text" id="questionText">이 사물의 이름은 무엇일까요?</div>
            
            <div id="optionsContainer" class="options-container">
                <!-- 선택지가 동적으로 생성됩니다 -->
            </div>
        </div>
    </div>

    <!-- 모듈 스크립트 -->
    <script type="module">
        import StoryQuizGame from '/js/games/StoryQuizGame.js';

        // 게임 인스턴스 생성
        const game = new StoryQuizGame({
            containerId: 'optionsContainer',
            debug: false,
            totalQuestions: 5,
            optionsCount: 4
        });

        // 전역으로 노출 (버튼 onclick에서 사용)
        window.game = game;

        // 게임 초기화
        game.init().catch(error => {
            console.error('❌ 게임 초기화 실패:', error);
        });

        console.log('✅ 모듈 로드 완료 - StoryQuizGame');
    </script>
</body>
</html>
