<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <!-- Android Fullscreen -->
    <meta name="theme-color" content="#000000">
    <meta name="color-scheme" content="dark">
    <link rel="manifest" href="/manifest.json">
    <title>동화책 읽기 - 탱고북</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        /* 전체 화면 */
        :root {
            --vh: 1vh;
        }
        
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            -webkit-overflow-scrolling: touch;
            /* Android 상단 바 숨김 */
            background: #000000;
        }
        
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a1a;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            height: calc(var(--vh, 1vh) * 100);
            min-height: 100vh;
            min-height: calc(var(--vh, 1vh) * 100);
            /* Android 상단 바 완전 숨김 */
            background: #000000;
        }
        
        /* 상단 주소창/하단 네비게이션 숨기기 */
        /* CSS로 처리됨 */
        
        /* 안전 영역 패딩 무시 */
        #reader {
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        
        .page-transition {
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
        }
        #page-image, #page-text {
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
        }
        .nav-button {
            transition: all 0.2s;
        }
        .nav-button:hover {
            transform: scale(1.1);
        }
        .nav-button:active {
            transform: scale(0.95);
        }
        
        /* 터치 영역 개선 */
        .nav-button {
            min-width: 48px;
            min-height: 48px;
        }
        
        /* 전체 화면 최적화 */
        #reader {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: calc(var(--vh, 1vh) * 100);
            width: 100vw;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }
        
        header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50px;
            padding: 0.75rem 1rem;
            font-size: 0.875rem;
            transition: transform 0.3s ease, opacity 0.3s ease;
            z-index: 20;
            background: linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0.6) 0%,
                rgba(0, 0, 0, 0.4) 50%,
                transparent 100%
            );
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        header.controls-hidden {
            transform: translateY(-100%);
            opacity: 0;
            pointer-events: none;
        }
        
        main {
            flex: 1;
            overflow: hidden;
            position: relative;
        }
        
        /* 기본 레이아웃 (세로 모드 / PC) */
        #page-content {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }
        
        #page-image-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            cursor: pointer;
            z-index: 1;
        }
        
        #page-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }
        
        #page-text-container {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            max-height: 25%;
            padding: 2rem 2rem 1.5rem 2rem;
            background: linear-gradient(
                to top, 
                rgba(0, 0, 0, 0.75) 0%, 
                rgba(0, 0, 0, 0.6) 25%,
                rgba(0, 0, 0, 0.4) 50%,
                rgba(0, 0, 0, 0.2) 75%,
                transparent 100%
            );
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 10;
            /* 텍스트는 항상 표시 - 토글하지 않음 */
        }
        
        #page-text-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.2), transparent);
        }
        
        #page-text {
            font-size: 1.375rem;
            line-height: 1.8;
            margin-bottom: 0;
            color: #ffffff;
            text-align: center;
            text-shadow: 
                0 1px 2px rgba(0, 0, 0, 0.8),
                0 2px 8px rgba(0, 0, 0, 0.6),
                0 0 10px rgba(0, 0, 0, 0.5);
            font-weight: 500;
            letter-spacing: 0.3px;
            word-break: keep-all;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* 헤더 TTS 버튼 */
        #tts-button-header {
            display: flex;
            align-items: center;
            gap: 0.375rem;
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 9999px;
            font-weight: 500;
            font-size: 0.8rem;
            box-shadow: 
                0 2px 6px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        #tts-button-header:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-1px);
        }
        
        #tts-button-header:active {
            transform: translateY(0);
        }
        
        #tts-button-header.playing {
            background: rgba(102, 126, 234, 0.4);
            border-color: rgba(102, 126, 234, 0.6);
            animation: pulse-glow 1.5s ease-in-out infinite;
        }
        
        /* 모바일 가로 모드 */
        @media (max-width: 926px) and (orientation: landscape) {
            header {
                height: 44px;
                padding: 0.5rem 1rem;
            }
            
            /* 이미지: 원본 비율 유지, 화면에 맞춤 */
            #page-image {
                width: auto;
                height: auto;
                max-width: 100%;
                max-height: 100%;
                object-fit: contain;
                object-position: center;
            }
            
            #page-text-container {
                padding: 1.5rem 1.25rem 1.25rem 1.25rem;
                max-height: 28%;
            }
            
            #page-text {
                font-size: 1.125rem;
                line-height: 1.65;
            }
            
            #tts-button-header {
                padding: 0.375rem 0.75rem;
                font-size: 0.75rem;
            }
            
            #prev-btn {
                left: 0.5rem;
            }
            
            #next-btn {
                right: 0.5rem;
            }
        }
        
        /* 모바일 세로 모드 */
        @media (max-width: 768px) and (orientation: portrait) {
            header {
                height: 44px;
                font-size: 0.75rem;
                padding: 0.5rem 0.75rem;
            }
            
            #page-text-container {
                padding: 1.5rem 1.25rem 1.25rem 1.25rem;
                max-height: 28%;
            }
            
            #page-text {
                font-size: 1.25rem;
                line-height: 1.7;
            }
            
            #tts-button-header {
                padding: 0.375rem 0.75rem;
                font-size: 0.7rem;
            }
            
            #tts-button-header span {
                display: none;
            }
            
            .nav-button {
                padding: 0.5rem;
                width: 40px;
                height: 40px;
            }
            
            .nav-button i {
                font-size: 1rem;
            }
        }
        
        /* 네비게이션 버튼 */
        .nav-button {
            z-index: 15;
            transition: all 0.3s ease;
        }
        
        .nav-button.controls-hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        @keyframes pulse-glow {
            0%, 100% {
                box-shadow: 
                    0 4px 15px rgba(245, 87, 108, 0.6),
                    0 2px 8px rgba(0, 0, 0, 0.3);
            }
            50% {
                box-shadow: 
                    0 6px 25px rgba(245, 87, 108, 0.8),
                    0 4px 12px rgba(0, 0, 0, 0.4);
            }
        }
    </style>
</head>
<body class="h-screen flex flex-col">
    <!-- 로딩 -->
    <div id="loading" class="h-screen flex items-center justify-center">
        <div class="text-center">
            <div class="inline-block animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-white"></div>
            <p class="text-white text-xl mt-4">동화책을 불러오는 중...</p>
        </div>
    </div>

    <!-- 메인 리더 -->
    <div id="reader" class="hidden h-screen flex flex-col">
        <!-- 헤더 -->
        <header class="bg-gray-800 text-white px-4 py-2 flex justify-between items-center">
            <button onclick="exitReader()" class="hover:text-gray-300 transition text-sm">
                <i class="fas fa-arrow-left mr-1"></i>
                <span class="hidden sm:inline">돌아가기</span>
            </button>
            
            <div class="flex items-center gap-3">
                <span id="progress-text" class="text-xs font-semibold">1 / 20</span>
                <button onclick="toggleAutoPlay()" class="hover:text-gray-300 transition" title="자동 재생">
                    <i class="fas fa-play text-sm" id="autoplay-icon"></i>
                </button>
                <!-- 읽어주기 버튼 -->
                <button 
                    id="tts-button-header"
                    onclick="playTTS(); event.stopPropagation();"
                    title="읽어주기"
                >
                    <i class="fas fa-volume-up"></i>
                    <span id="tts-text">읽어주기</span>
                </button>
            </div>
        </header>

        <!-- 메인 콘텐츠 -->
        <main class="flex-1 flex items-center justify-center relative bg-gray-900">
            <!-- 이전 버튼 -->
            <button 
                id="prev-btn"
                onclick="previousPage()"
                class="nav-button absolute left-2 bg-white/90 hover:bg-white p-3 rounded-full shadow-xl z-10"
            >
                <i class="fas fa-chevron-left text-xl text-gray-800"></i>
            </button>
            
            <!-- 페이지 콘텐츠 -->
            <div id="page-content">
                <!-- 이미지 -->
                <div id="page-image-container" onclick="toggleControls()">
                    <img 
                        id="page-image" 
                        src="" 
                        alt=""
                    >
                </div>
                
                <!-- 텍스트 오버레이 -->
                <div id="page-text-container" class="controls">
                    <p id="page-text"></p>
                </div>
            </div>
            
            <!-- 다음 버튼 -->
            <button 
                id="next-btn"
                onclick="nextPage()"
                class="nav-button absolute right-2 bg-white/90 hover:bg-white p-3 rounded-full shadow-xl z-10"
            >
                <i class="fas fa-chevron-right text-xl text-gray-800"></i>
            </button>
        </main>

        <!-- 진행바 -->
        <div class="bg-gray-800 p-2">
            <div class="bg-gray-700 rounded-full h-2">
                <div id="progress-bar" class="bg-blue-500 h-2 rounded-full transition-all duration-300" style="width: 5%"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
    <script src="/viewer/js/reader.js?v=20250122-toggle-debug"></script>
</body>
</html>
