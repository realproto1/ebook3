<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <!-- Android Fullscreen -->
    <meta name="theme-color" content="#000000">
    <meta name="color-scheme" content="dark">
    <link rel="manifest" href="/manifest.json">
    <title>동화책 읽기 - 탱고북</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        /* 전체 화면 */
        :root {
            --vh: 1vh;
        }
        
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            -webkit-overflow-scrolling: touch;
            /* Android 상단 바 숨김 */
            background: #000000;
        }
        
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a1a;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            height: calc(var(--vh, 1vh) * 100);
            min-height: 100vh;
            min-height: calc(var(--vh, 1vh) * 100);
            /* Android 상단 바 완전 숨김 */
            background: #000000;
        }
        
        /* 상단 주소창/하단 네비게이션 숨기기 */
        /* CSS로 처리됨 */
        
        /* 안전 영역 패딩 무시 */
        #reader {
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        
        .page-transition {
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
        }
        #page-image, #page-text {
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
        }
        .nav-button {
            transition: all 0.2s;
        }
        .nav-button:hover {
            transform: scale(1.1);
        }
        .nav-button:active {
            transform: scale(0.95);
        }
        
        /* 터치 영역 개선 */
        .nav-button {
            min-width: 48px;
            min-height: 48px;
        }
        
        /* 전체 화면 최적화 */
        #reader {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: calc(var(--vh, 1vh) * 100);
            width: 100vw;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }
        
        header {
            flex-shrink: 0;
            height: 44px;
            padding: 0.5rem 1rem !important;
            font-size: 0.875rem;
            transition: transform 0.3s ease;
            position: relative;
            z-index: 20;
        }
        
        header.hidden {
            transform: translateY(-100%);
        }
        
        main {
            flex: 1;
            overflow: hidden;
            position: relative;
        }
        
        /* 기본 레이아웃 (세로 모드 / PC) */
        #page-content {
            height: 100%;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
        }
        
        #page-image-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #000;
        }
        
        #page-image {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            object-position: center;
        }
        
        /* PC 및 태블릿 - 이미지 화면에 꽉 차게 */
        @media (min-width: 769px) {
            #page-image {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
        }
        
        #page-text-container {
            flex-shrink: 0;
            max-height: 25%;
            overflow-y: auto;
            padding: 1rem !important;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0.7));
            backdrop-filter: blur(10px);
            z-index: 10;
        }
        
        #page-text {
            font-size: 1rem !important;
            line-height: 1.6 !important;
            margin-bottom: 0.75rem !important;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        /* 모바일 가로 모드 - 좌우 분할 레이아웃 */
        @media (max-width: 926px) and (orientation: landscape) {
            #page-content {
                flex-direction: row;
            }
            
            #page-image-container {
                flex: 0 0 65%;
                max-width: 65%;
            }
            
            #page-text-container {
                flex: 0 0 35%;
                max-width: 35%;
                max-height: 100%;
                position: relative;
                background: rgba(0, 0, 0, 0.85);
                display: flex;
                flex-direction: column;
                justify-content: center;
                padding: 1.5rem !important;
            }
            
            #page-text {
                font-size: 0.95rem !important;
                line-height: 1.5 !important;
            }
            
            /* 가로 모드에서 버튼 위치 조정 */
            #prev-btn {
                left: 0.5rem !important;
            }
            
            #next-btn {
                right: 35% !important;
                margin-right: 0.5rem !important;
            }
        }
        
        /* 모바일 세로 모드 */
        @media (max-width: 768px) and (orientation: portrait) {
            header {
                height: 36px !important;
                font-size: 0.75rem;
                padding: 0.25rem 0.75rem !important;
            }
            
            .nav-button {
                padding: 0.5rem !important;
                width: 40px !important;
                height: 40px !important;
            }
            
            .nav-button i {
                font-size: 1rem !important;
            }
            
            #page-text-container {
                padding: 0.75rem !important;
                max-height: 30%;
            }
            
            #page-text {
                font-size: 0.9rem !important;
                line-height: 1.5 !important;
            }
            
            button {
                padding: 0.5rem 0.75rem !important;
                font-size: 0.75rem !important;
            }
        }
        
        /* 네비게이션 버튼 z-index */
        .nav-button {
            z-index: 15;
        }
        
        /* 진행바 숨기기 (더 많은 공간 확보) */
        #progress-bar-container {
            display: none;
        }
    </style>
</head>
<body class="h-screen flex flex-col">
    <!-- 로딩 -->
    <div id="loading" class="h-screen flex items-center justify-center">
        <div class="text-center">
            <div class="inline-block animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-white"></div>
            <p class="text-white text-xl mt-4">동화책을 불러오는 중...</p>
        </div>
    </div>

    <!-- 메인 리더 -->
    <div id="reader" class="hidden h-screen flex flex-col">
        <!-- 헤더 -->
        <header class="bg-gray-800 text-white px-4 py-2 flex justify-between items-center">
            <button onclick="exitReader()" class="hover:text-gray-300 transition text-sm">
                <i class="fas fa-arrow-left mr-1"></i>
                <span class="hidden sm:inline">돌아가기</span>
            </button>
            
            <div class="flex items-center gap-3">
                <span id="progress-text" class="text-xs font-semibold">1 / 20</span>
                <button onclick="toggleAutoPlay()" class="hover:text-gray-300 transition" title="자동 재생">
                    <i class="fas fa-play text-sm" id="autoplay-icon"></i>
                </button>
            </div>
        </header>

        <!-- 메인 콘텐츠 -->
        <main class="flex-1 flex items-center justify-center relative bg-gray-900">
            <!-- 이전 버튼 -->
            <button 
                id="prev-btn"
                onclick="previousPage()"
                class="nav-button absolute left-2 bg-white/90 hover:bg-white p-3 rounded-full shadow-xl z-10"
            >
                <i class="fas fa-chevron-left text-xl text-gray-800"></i>
            </button>
            
            <!-- 페이지 콘텐츠 -->
            <div id="page-content">
                <!-- 이미지 -->
                <div id="page-image-container" class="mb-2 overflow-hidden">
                    <img 
                        id="page-image" 
                        src="" 
                        alt="" 
                        class="page-transition"
                    >
                </div>
                
                <!-- 텍스트 -->
                <div id="page-text-container">
                    <p id="page-text" class="mb-2"></p>
                    
                    <!-- TTS 재생 버튼 -->
                    <button 
                        onclick="playTTS()"
                        class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-full font-medium transition shadow-lg text-sm"
                    >
                        <i class="fas fa-volume-up mr-2"></i>
                        <span id="tts-text">읽어주기</span>
                    </button>
                </div>
            </div>
            
            <!-- 다음 버튼 -->
            <button 
                id="next-btn"
                onclick="nextPage()"
                class="nav-button absolute right-2 bg-white/90 hover:bg-white p-3 rounded-full shadow-xl z-10"
            >
                <i class="fas fa-chevron-right text-xl text-gray-800"></i>
            </button>
        </main>

        <!-- 진행바 -->
        <div class="bg-gray-800 p-2">
            <div class="bg-gray-700 rounded-full h-2">
                <div id="progress-bar" class="bg-blue-500 h-2 rounded-full transition-all duration-300" style="width: 5%"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
    <script src="/viewer/js/reader.js"></script>
</body>
</html>
