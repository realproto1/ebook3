<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>동화책 읽기 - 탱고북</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        /* 강제 가로 모드 및 전체 화면 */
        :root {
            --vh: 1vh;
        }
        
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a1a;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            position: fixed;
        }
        
        /* 상단 주소창/하단 네비게이션 숨기기 */
        body {
            /* iOS Safari */
            height: 100vh;
            height: calc(var(--vh, 1vh) * 100);
            /* Android Chrome */
            min-height: 100vh;
            min-height: calc(var(--vh, 1vh) * 100);
        }
        
        /* 안전 영역 패딩 무시 */
        #reader {
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        
        /* 세로 모드일 때 90도 회전 */
        @media screen and (orientation: portrait) {
            html {
                transform: rotate(90deg);
                transform-origin: left top;
                width: 100vh;
                height: 100vw;
                overflow-x: hidden;
                position: absolute;
                top: 100%;
                left: 0;
            }
        }
        .page-transition {
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
        }
        #page-image, #page-text {
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
        }
        .nav-button {
            transition: all 0.2s;
        }
        .nav-button:hover {
            transform: scale(1.1);
        }
        .nav-button:active {
            transform: scale(0.95);
        }
        
        /* 모바일 최적화 */
        @media (max-width: 768px) {
            header {
                padding: 0.75rem 1rem;
            }
            
            .nav-button {
                padding: 0.75rem !important;
            }
            
            .nav-button i {
                font-size: 1.25rem !important;
            }
            
            #page-content {
                padding-left: 3rem !important;
                padding-right: 3rem !important;
            }
            
            #page-text {
                font-size: 1.125rem !important;
                padding: 1rem !important;
            }
            
            #page-image-container {
                margin-bottom: 0.75rem !important;
            }
        }
        
        /* 터치 영역 개선 */
        .nav-button {
            min-width: 48px;
            min-height: 48px;
        }
        
        /* 전체 화면 최적화 */
        #reader {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: calc(var(--vh, 1vh) * 100);
            width: 100vw;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }
        
        header {
            flex-shrink: 0;
            height: 50px;
            padding: 0.5rem 1rem !important;
        }
        
        main {
            flex: 1;
            overflow: hidden;
        }
        
        #page-content {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 4rem !important;
        }
        
        #page-image-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem !important;
        }
        
        #page-image {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
        }
        
        #page-text-container {
            flex-shrink: 0;
            max-height: 30%;
            overflow-y: auto;
        }
        
        /* 모바일에서 더 작은 헤더 */
        @media (max-width: 768px) {
            header {
                height: 40px !important;
                font-size: 0.875rem;
            }
            
            #page-content {
                padding: 0 2rem !important;
            }
            
            .nav-button {
                padding: 0.5rem !important;
            }
        }
        
        /* 진행바 숨기기 (더 많은 공간 확보) */
        #progress-bar-container {
            display: none;
        }
    </style>
</head>
<body class="h-screen flex flex-col">
    <!-- 로딩 -->
    <div id="loading" class="h-screen flex items-center justify-center">
        <div class="text-center">
            <div class="inline-block animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-white"></div>
            <p class="text-white text-xl mt-4">동화책을 불러오는 중...</p>
        </div>
    </div>

    <!-- 메인 리더 -->
    <div id="reader" class="hidden h-screen flex flex-col">
        <!-- 헤더 -->
        <header class="bg-gray-800 text-white px-6 py-4 flex justify-between items-center">
            <button onclick="exitReader()" class="hover:text-gray-300 transition">
                <i class="fas fa-arrow-left mr-2"></i>
                돌아가기
            </button>
            
            <div class="flex items-center gap-4">
                <span id="progress-text" class="text-sm font-semibold">1 / 20</span>
                <button onclick="toggleAutoPlay()" class="hover:text-gray-300 transition" title="자동 재생">
                    <i class="fas fa-play" id="autoplay-icon"></i>
                </button>
            </div>
        </header>

        <!-- 메인 콘텐츠 -->
        <main class="flex-1 flex items-center justify-center relative bg-gray-900">
            <!-- 이전 버튼 -->
            <button 
                id="prev-btn"
                onclick="previousPage()"
                class="nav-button absolute left-4 bg-white/90 hover:bg-white p-4 rounded-full shadow-2xl z-10"
            >
                <i class="fas fa-chevron-left text-2xl text-gray-800"></i>
            </button>
            
            <!-- 페이지 콘텐츠 -->
            <div id="page-content" class="max-w-5xl w-full px-20">
                <!-- 이미지 -->
                <div id="page-image-container" class="mb-6 rounded-2xl overflow-hidden shadow-2xl bg-white">
                    <img 
                        id="page-image" 
                        src="" 
                        alt="" 
                        class="w-full h-auto page-transition"
                    >
                </div>
                
                <!-- 텍스트 -->
                <div id="page-text-container" class="bg-white rounded-2xl p-4 shadow-2xl">
                    <p id="page-text" class="text-lg leading-relaxed text-gray-800 mb-3"></p>
                    
                    <!-- TTS 재생 버튼 -->
                    <button 
                        onclick="playTTS()"
                        class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-full font-semibold transition shadow-lg text-sm"
                    >
                        <i class="fas fa-volume-up mr-1"></i>
                        <span id="tts-text">읽어주기</span>
                    </button>
                </div>
            </div>
            
            <!-- 다음 버튼 -->
            <button 
                id="next-btn"
                onclick="nextPage()"
                class="nav-button absolute right-4 bg-white/90 hover:bg-white p-4 rounded-full shadow-2xl z-10"
            >
                <i class="fas fa-chevron-right text-2xl text-gray-800"></i>
            </button>
        </main>

        <!-- 진행바 -->
        <div class="bg-gray-800 p-2">
            <div class="bg-gray-700 rounded-full h-2">
                <div id="progress-bar" class="bg-blue-500 h-2 rounded-full transition-all duration-300" style="width: 5%"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
    <script src="/viewer/js/reader.js"></script>
</body>
</html>
