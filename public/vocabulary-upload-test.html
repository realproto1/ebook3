<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학습 단어 이미지 업로드 테스트</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
</head>
<body class="bg-gradient-to-br from-purple-100 to-pink-100 min-h-screen p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-4xl font-bold text-purple-800 mb-8 text-center">
            <i class="fas fa-image mr-3"></i>
            학습 단어 이미지 업로드 테스트
        </h1>
        
        <!-- 로컬 파일 업로드 -->
        <div class="bg-white rounded-3xl shadow-2xl p-8 mb-8">
            <h2 class="text-2xl font-bold text-blue-600 mb-6">
                <i class="fas fa-file-upload mr-2"></i>
                방법 1: 로컬 파일 업로드
            </h2>
            
            <form id="fileUploadForm" class="space-y-4">
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">
                        <i class="fas fa-spell-check mr-2"></i>영어 단어
                    </label>
                    <input 
                        type="text" 
                        id="word" 
                        placeholder="예: apple" 
                        required
                        class="w-full px-4 py-3 border-2 border-blue-300 rounded-lg focus:outline-none focus:border-blue-500"
                    >
                </div>
                
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">
                        <i class="fas fa-language mr-2"></i>한글 뜻
                    </label>
                    <input 
                        type="text" 
                        id="korean" 
                        placeholder="예: 사과"
                        class="w-full px-4 py-3 border-2 border-blue-300 rounded-lg focus:outline-none focus:border-blue-500"
                    >
                </div>
                
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">
                        <i class="fas fa-image mr-2"></i>이미지 파일
                    </label>
                    <input 
                        type="file" 
                        id="imageFile" 
                        accept="image/*" 
                        required
                        class="w-full px-4 py-3 border-2 border-blue-300 rounded-lg focus:outline-none focus:border-blue-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"
                    >
                </div>
                
                <button 
                    type="submit"
                    class="w-full bg-gradient-to-r from-blue-500 to-blue-600 text-white py-4 rounded-lg font-bold hover:from-blue-600 hover:to-blue-700 transition shadow-lg"
                >
                    <i class="fas fa-upload mr-2"></i>파일 업로드
                </button>
            </form>
            
            <div id="fileResult" class="mt-6"></div>
        </div>
        
        <!-- URL 업로드 -->
        <div class="bg-white rounded-3xl shadow-2xl p-8">
            <h2 class="text-2xl font-bold text-green-600 mb-6">
                <i class="fas fa-link mr-2"></i>
                방법 2: 이미지 URL 업로드
            </h2>
            
            <form id="urlUploadForm" class="space-y-4">
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">
                        <i class="fas fa-spell-check mr-2"></i>영어 단어
                    </label>
                    <input 
                        type="text" 
                        id="wordUrl" 
                        placeholder="예: banana" 
                        required
                        class="w-full px-4 py-3 border-2 border-green-300 rounded-lg focus:outline-none focus:border-green-500"
                    >
                </div>
                
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">
                        <i class="fas fa-language mr-2"></i>한글 뜻
                    </label>
                    <input 
                        type="text" 
                        id="koreanUrl" 
                        placeholder="예: 바나나"
                        class="w-full px-4 py-3 border-2 border-green-300 rounded-lg focus:outline-none focus:border-green-500"
                    >
                </div>
                
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">
                        <i class="fas fa-globe mr-2"></i>이미지 URL
                    </label>
                    <input 
                        type="text" 
                        id="imageUrl" 
                        placeholder="https://example.com/image.png" 
                        required
                        class="w-full px-4 py-3 border-2 border-green-300 rounded-lg focus:outline-none focus:border-green-500"
                    >
                </div>
                
                <button 
                    type="submit"
                    class="w-full bg-gradient-to-r from-green-500 to-green-600 text-white py-4 rounded-lg font-bold hover:from-green-600 hover:to-green-700 transition shadow-lg"
                >
                    <i class="fas fa-cloud-upload-alt mr-2"></i>URL 업로드
                </button>
            </form>
            
            <div id="urlResult" class="mt-6"></div>
        </div>
        
        <!-- API 정보 -->
        <div class="bg-yellow-50 border-2 border-yellow-300 rounded-2xl p-6 mt-8">
            <h3 class="text-lg font-bold text-yellow-800 mb-3">
                <i class="fas fa-info-circle mr-2"></i>
                API 정보
            </h3>
            <div class="space-y-2 text-sm text-gray-700">
                <p><strong>Endpoint:</strong> <code class="bg-gray-200 px-2 py-1 rounded">/api/upload-vocabulary-image</code></p>
                <p><strong>Method:</strong> <code class="bg-gray-200 px-2 py-1 rounded">POST</code></p>
                <p><strong>Authentication:</strong> API Key required (X-API-KEY header)</p>
                <p><strong>Max File Size:</strong> 10MB</p>
                <p><strong>Supported Formats:</strong> JPG, PNG, GIF</p>
                <p><strong>Storage:</strong> Cloudflare R2 (자동 저장)</p>
            </div>
        </div>
    </div>
    
    <script>
        // ⚠️ 실제 사용 시 API 키를 서버에서 안전하게 가져오세요
        const API_KEY = 'test-api-key'; // 개발용 키
        const API_URL = '/api/upload-vocabulary-image';
        
        // 결과 표시 함수
        function showResult(elementId, success, data, error) {
            const element = document.getElementById(elementId);
            
            if (success) {
                element.innerHTML = `
                    <div class="bg-green-50 border-2 border-green-300 rounded-lg p-4">
                        <p class="text-green-800 font-bold mb-2">
                            <i class="fas fa-check-circle mr-2"></i>
                            업로드 성공!
                        </p>
                        <div class="space-y-2 text-sm text-gray-700">
                            <p><strong>단어:</strong> ${data.word} ${data.korean ? `(${data.korean})` : ''}</p>
                            <p><strong>이미지 URL:</strong></p>
                            <a href="${data.imageUrl}" target="_blank" class="text-blue-600 hover:underline break-all">
                                ${data.imageUrl}
                            </a>
                            <div class="mt-4">
                                <img src="${data.imageUrl}" alt="${data.word}" class="max-w-xs rounded-lg shadow-lg" />
                            </div>
                        </div>
                    </div>
                `;
            } else {
                element.innerHTML = `
                    <div class="bg-red-50 border-2 border-red-300 rounded-lg p-4">
                        <p class="text-red-800 font-bold mb-2">
                            <i class="fas fa-exclamation-circle mr-2"></i>
                            업로드 실패
                        </p>
                        <p class="text-sm text-gray-700">${error}</p>
                    </div>
                `;
            }
        }
        
        // 로컬 파일 업로드
        document.getElementById('fileUploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData();
            formData.append('word', document.getElementById('word').value);
            formData.append('korean', document.getElementById('korean').value);
            formData.append('image', document.getElementById('imageFile').files[0]);
            
            // 로딩 표시
            document.getElementById('fileResult').innerHTML = `
                <div class="text-center py-4">
                    <i class="fas fa-spinner fa-spin text-4xl text-blue-500"></i>
                    <p class="mt-2 text-gray-600">업로드 중...</p>
                </div>
            `;
            
            try {
                const response = await axios.post(API_URL, formData, {
                    headers: {
                        'X-API-KEY': API_KEY
                    }
                });
                
                showResult('fileResult', true, response.data);
            } catch (error) {
                showResult('fileResult', false, null, error.response?.data?.error || error.message);
            }
        });
        
        // URL 업로드
        document.getElementById('urlUploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const data = {
                word: document.getElementById('wordUrl').value,
                korean: document.getElementById('koreanUrl').value,
                imageUrl: document.getElementById('imageUrl').value
            };
            
            // 로딩 표시
            document.getElementById('urlResult').innerHTML = `
                <div class="text-center py-4">
                    <i class="fas fa-spinner fa-spin text-4xl text-green-500"></i>
                    <p class="mt-2 text-gray-600">업로드 중...</p>
                </div>
            `;
            
            try {
                const response = await axios.post(API_URL, data, {
                    headers: {
                        'X-API-KEY': API_KEY,
                        'Content-Type': 'application/json'
                    }
                });
                
                showResult('urlResult', true, response.data);
            } catch (error) {
                showResult('urlResult', false, null, error.response?.data?.error || error.message);
            }
        });
    </script>
</body>
</html>
