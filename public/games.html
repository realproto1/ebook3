<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>독후활동 게임 - 탱고북</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .main-title {
            font-size: 48px;
            font-weight: bold;
            color: white;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .story-title {
            font-size: 24px;
            color: rgba(255,255,255,0.9);
            margin-bottom: 20px;
        }

        .subtitle {
            font-size: 18px;
            color: rgba(255,255,255,0.8);
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .game-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .game-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .game-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .game-card:hover::before {
            opacity: 1;
        }

        .game-card.purple {
            border-top: 5px solid #9C27B0;
        }

        .game-card.pink {
            border-top: 5px solid #E91E63;
        }

        .game-card.blue {
            border-top: 5px solid #2196F3;
        }

        .game-card.orange {
            border-top: 5px solid #FF9800;
        }

        .game-icon {
            font-size: 60px;
            text-align: center;
            margin-bottom: 20px;
        }

        .game-card.purple .game-icon { color: #9C27B0; }
        .game-card.pink .game-icon { color: #E91E63; }
        .game-card.blue .game-icon { color: #2196F3; }
        .game-card.orange .game-icon { color: #FF9800; }

        .game-title {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            text-align: center;
            margin-bottom: 15px;
        }

        .game-description {
            font-size: 16px;
            color: #666;
            text-align: center;
            line-height: 1.6;
        }

        .back-button {
            position: fixed;
            top: 30px;
            left: 30px;
            background: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            z-index: 100;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        @media (max-width: 768px) {
            .main-title {
                font-size: 32px;
            }

            .story-title {
                font-size: 20px;
            }

            .subtitle {
                font-size: 16px;
            }

            .games-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .game-card {
                padding: 25px;
            }

            .game-icon {
                font-size: 50px;
            }

            .game-title {
                font-size: 20px;
            }

            .game-description {
                font-size: 14px;
            }

            .back-button {
                top: 20px;
                left: 20px;
                width: 50px;
                height: 50px;
            }
        }
    </style>
</head>
<body>
    <!-- 뒤로가기 버튼 -->
    <div class="back-button" onclick="goBack()">
        <i class="fas fa-arrow-left" style="font-size: 28px; color: #667eea;"></i>
    </div>

    <div class="container">
        <!-- 헤더 -->
        <div class="header">
            <div class="main-title">
                <i class="fas fa-gamepad"></i>
                독후활동 게임
            </div>
            <div class="story-title" id="storyTitle">동화책</div>
            <div class="subtitle">재미있는 게임으로 동화를 복습해보세요!</div>
        </div>

        <!-- 게임 목록 -->
        <div class="games-grid">
            <!-- 1. 핵심 사물 퀴즈 -->
            <div class="game-card purple" onclick="startGame('story-quiz')">
                <div class="game-icon">
                    <i class="fas fa-question-circle"></i>
                </div>
                <div class="game-title">핵심 사물 퀴즈</div>
                <div class="game-description">
                    Key Objects를 찾아보며<br>
                    동화 내용을 복습해요!
                </div>
            </div>

            <!-- 2. 사물 카드 매칭 -->
            <div class="game-card pink" onclick="startGame('memory-match')">
                <div class="game-icon">
                    <i class="fas fa-clone"></i>
                </div>
                <div class="game-title">사물 카드 매칭</div>
                <div class="game-description">
                    카드를 뒤집어서<br>
                    이미지와 이름을 매칭해요!
                </div>
            </div>

            <!-- 3. 스토리 순서 맞추기 -->
            <div class="game-card blue" onclick="startGame('story-sequence')">
                <div class="game-icon">
                    <i class="fas fa-sort-numeric-down"></i>
                </div>
                <div class="game-title">스토리 순서 맞추기</div>
                <div class="game-description">
                    이야기의 순서를<br>
                    올바르게 배열해요!
                </div>
            </div>

            <!-- 4. 단어 따라 써보기 -->
            <div class="game-card orange" onclick="startGame('word-writing')">
                <div class="game-icon">
                    <i class="fas fa-pen-fancy"></i>
                </div>
                <div class="game-title">단어 따라 써보기</div>
                <div class="game-description">
                    핵심 사물의 이름을<br>
                    따라 써보아요!
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
    <script>
        // URL에서 스토리 ID 가져오기
        const urlParams = new URLSearchParams(window.location.search);
        const storyId = urlParams.get('story') || urlParams.get('id');

        if (!storyId) {
            alert('스토리 ID가 없습니다.');
            goBack();
        }

        // 스토리 정보 로드
        async function loadStoryInfo() {
            try {
                console.log('📚 스토리 정보 로딩:', storyId);
                const response = await axios.get(`/api/storybooks/${storyId}`);
                const storyData = response.data;
                
                console.log('✅ 스토리 로드 완료:', storyData.title);
                document.getElementById('storyTitle').textContent = storyData.title || '동화책';
            } catch (error) {
                console.error('❌ 스토리 로드 실패:', error);
                document.getElementById('storyTitle').textContent = '동화책';
            }
        }

        // 게임 시작
        function startGame(gameType) {
            console.log(`🎮 게임 시작: ${gameType}`);
            window.location.href = `/games/${gameType}.html?id=${storyId}`;
        }

        // 뒤로가기
        function goBack() {
            window.history.back();
        }

        // 페이지 로드 시 실행
        loadStoryInfo();
    </script>
</body>
</html>
