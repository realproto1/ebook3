<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학습 게임 - 탱고북</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            min-height: 100vh;
        }
        .game-card {
            transition: all 0.3s ease;
        }
        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .selected {
            border: 3px solid #3b82f6;
            background: #dbeafe;
        }
        .correct {
            border: 3px solid #10b981;
            background: #d1fae5;
        }
        .wrong {
            border: 3px solid #ef4444;
            background: #fee2e2;
        }
    </style>
</head>
<body>
    <div class="container mx-auto px-4 py-8">
        <!-- 헤더 -->
        <header class="mb-8">
            <button onclick="window.history.back()" class="text-white hover:text-gray-200 transition mb-4">
                <i class="fas fa-arrow-left mr-2"></i>
                돌아가기
            </button>
            <h1 class="text-4xl font-bold text-white mb-2">
                <i class="fas fa-gamepad mr-3"></i>
                학습 게임
            </h1>
            <p id="book-title" class="text-white text-xl opacity-90"></p>
        </header>

        <!-- 로딩 -->
        <div id="loading" class="text-center py-20">
            <div class="inline-block animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-white"></div>
            <p class="text-white text-xl mt-4">게임을 준비하는 중...</p>
        </div>

        <!-- 게임 컨테이너 -->
        <div id="game-container" class="hidden">
            <!-- 게임 선택 탭 -->
            <div class="bg-white rounded-2xl shadow-xl p-6 mb-6">
                <h2 class="text-xl font-bold text-gray-800 mb-4">게임 선택</h2>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <button onclick="selectGame('matching')" class="game-tab px-6 py-4 rounded-xl bg-gradient-to-r from-purple-500 to-pink-500 text-white font-bold hover:from-purple-600 hover:to-pink-600 transition">
                        <i class="fas fa-puzzle-piece text-2xl mb-2"></i>
                        <div>단어 매칭</div>
                    </button>
                    <button onclick="selectGame('quiz')" class="game-tab px-6 py-4 rounded-xl bg-gradient-to-r from-blue-500 to-cyan-500 text-white font-bold hover:from-blue-600 hover:to-cyan-600 transition">
                        <i class="fas fa-question-circle text-2xl mb-2"></i>
                        <div>스토리 퀴즈</div>
                    </button>
                    <button onclick="selectGame('character')" class="game-tab px-6 py-4 rounded-xl bg-gradient-to-r from-green-500 to-teal-500 text-white font-bold hover:from-green-600 hover:to-teal-600 transition">
                        <i class="fas fa-users text-2xl mb-2"></i>
                        <div>캐릭터 맞추기</div>
                    </button>
                    <button onclick="selectGame('sequence')" class="game-tab px-6 py-4 rounded-xl bg-gradient-to-r from-orange-500 to-red-500 text-white font-bold hover:from-orange-600 hover:to-red-600 transition">
                        <i class="fas fa-sort-numeric-down text-2xl mb-2"></i>
                        <div>순서 맞추기</div>
                    </button>
                </div>
            </div>

            <!-- 게임 콘텐츠 -->
            <div id="game-content" class="bg-white rounded-2xl shadow-xl p-8">
                <!-- JavaScript로 동적 생성 -->
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
    <script src="/viewer/js/games.js"></script>
</body>
</html>
